ing to the GitLab README setup section.',"Set .banner a color to --accent so links in banners are readable against both light and dark banner backgrounds."]},{version:"1.13.4",date:"2026-06-03",title:"Require valid fields before saving a profile",changes:['Disable "Save as profile\u2026" button unless endpoint is a valid URL, bucket is present (no spaces, \u2264 63 chars), and key ID is present (no spaces) \u2014 the minimum needed to make the profile useful.',"Add canSaveProfile() to credential-validation.js (pure, tested).","Disabled button shows a tooltip explaining what is needed.","Add 13 new tests for canSaveProfile covering presence, URL validity, bucket format, and key ID format."]},{version:"1.13.3",date:"2026-06-03",title:"Storage & Privacy viewer",changes:['Add "Storage & Privacy" modal (footer link, always accessible regardless of session state) showing a live snapshot of every value the app stores.',"Six collapsible sections: Connection, Saved Profiles, Upload History, Incomplete Uploads, Settings, Runtime State \u2014 each with a scoped clear action.",'Secret key shown as presence indicator only ("Present (session only)" / "Not stored") \u2014 the value is never rendered.','"Clear All App Data" removes every localStorage, sessionStorage, and IndexedDB entry the app has ever written, then reloads to a fresh state.',"New wipeAllAppData(), resetSettings(), deleteAllProfiles() in storage.js.","New loadAllResumeRecords(), clearAllResumeRecords(), deleteDatabase(), loadActiveUploads(), clearActiveUploads() in indexeddb.js.","Storage catalog documented in docs/storage-catalog.md; feature design in docs/design-storage-viewer.md."]},{version:"1.13.2",date:"2026-06-03",title:"Fix saved profile not populating form fields on load",changes:["Fix: selecting a saved profile after disconnect left the credential form blank. Root cause: credentials state was initialized before selectedProfileId, so the initializer had no profile to draw from. Fix: declare selectedProfileId first, then seed credentials from the matched profile when one is restored.","Mount useEffect now uses profile data as the base for auto-connect, matching the same lookup order as the initializer."]},{version:"1.13.1",date:"2026-06-03",title:"Credential field validation and storage write-boundary enforcement (BUG-016)",changes:["Add repairStorageInvariants(): runs on every mount before migration; clears s3b_provider if it contains whitespace or exceeds 20 chars; repairs stored profiles with corrupted provider field. Idempotent no-op once data is clean.","loadCredentials(): sanitize provider on read \u2014 return null for any value that fails the identifier check, so corrupted data never enters app state","saveCredentials(): sanitize provider on write \u2014 write '' if the value is not a valid short identifier, so corruption cannot be re-persisted","readUrlParams(): validate provider hash param before accepting \u2014 ignore any value containing whitespace or exceeding 20 chars","CredentialForm: inline validation errors block submit when key ID, secret key, bucket, or region contain whitespace; warn when bucket exceeds 63 characters","Extract credentialErrors() to src/lib/credential-validation.js (pure, tested)","Add 27 new tests across storage, url-params, and credential-validation suites"]},{version:"1.13.0",date:"2026-06-02",title:"Multi-profile credential management",changes:["Add named profile storage: save N connection profiles (endpoint, bucket, key ID, provider) to localStorage; secret key is never stored","Profile picker on connect screen: select a saved profile to pre-fill the form",'"Save as profile" explicit action with user-defined display name',"Delete profile from picker","Silent migration: existing credentials become a named default profile on first load","Current profile name shown in connected sidebar","Storage layer: versioned envelope ({ version: 1, profiles: [] }), upsert primitive, tolerant loading (unknown fields preserved for forward compatibility)","Profile keys stored outside LS_KEYS so clearCredentials() does not wipe them on disconnect"]},{version:"1.12.24",date:"2026-06-02",title:"Make background update check toggleable in settings",changes:["Add loadUpdateCheckEnabled / saveUpdateCheckEnabled to storage.js","UpdateBanner accepts enabled prop; polling starts/stops reactively via useEffect dependency",'SettingsPanel exposes a "Background update checks" checkbox with immediate effect (no Save needed)',"Defaults to enabled \u2014 no behaviour change for existing users"]},{version:"1.12.23",date:"2026-06-02",title:"Add live instance link and canonical repo note to README",changes:['Add "Try it live" link to bucketer.hidayahtech.net and canonical GitLab repo reference below the badges']},{version:"1.12.22",date:"2026-06-02",title:"Add About modal and expand README intro",changes:["Add AboutModal component with five-pitch product overview and personal author note",'About modal accessible from footer "About" link and splash screen "Learn more \u2192"','Splash screen "About Bucketer" section replaced with full narrative description',"README intro rebuilt: five-pitch marketing section, narrative, author note with Palestine solidarity statement","Save prose narrative to docs/narrative-description.md for reuse elsewhere"]},{version:"1.12.21",date:"2026-06-02",title:"Expand app title to full descriptive name",changes:["Set appTitle constant in build.mjs as single source for <title>, og:title, and twitter:title",'Title is now "Bucketer \u2014 In-Browser S3-Compatible Bucket Manager" across all three tags']},{version:"1.12.20",date:"2026-06-02",title:"Add Open Graph meta tags and OG preview image",changes:["Add og:title, og:description, og:image, og:url, and Twitter Card meta tags to src/index.html","Add src/assets/og-image.png (1200\xD7630, optimized with oxipng) for link preview cards","Update build.mjs to copy og-image.png to dist/ on every build"]},{version:"1.12.19",date:"2026-06-02",title:"Inline header logo as component",changes:["Convert header logo from static <img> to inline Preact component","Bump logo size to 3rem for better visibility"]},{version:"1.12.18",date:"2026-06-01",title:"Update footer with Bucketer repo link",changes:['Footer now reads "Bucketer \u2014 Copyright \xA9 2026 HidayahTech, LLC"','"Bucketer" links to the canonical GitLab repo so visitors can find the source']},{version:"1.12.17",date:"2026-06-01",title:"Fix version tag push timing",changes:["Fix pre-push hook so version tags are pushed immediately rather than one commit late","Hook now explicitly pushes the new tag itself instead of relying on push.followTags","Tag-only recursive pushes skip the build/test cycle to avoid redundant work"]},{version:"1.12.16",date:"2026-06-01",title:"Upstream release check in changelog",changes:['Add "Check for upstream release" button to the changelog modal',"Fetches the latest GitLab release via API and displays the release badge alongside a status line (up to date / update available with link)","Result is cached for the duration of the tab session"]},{version:"1.12.15",date:"2026-06-01",title:"README badges",changes:["Add pipeline status, latest release, and AGPL v3 license badges to README"]},{version:"1.12.14",date:"2026-06-01",title:"CI release job",changes:["Added scripts/release.mjs \u2014 uploads dist/index.html to the Package Registry and creates a GitLab Release with CHANGELOG description and asset link",".gitlab-ci.yml now has two stages: test and release","Release job runs only on version tags (v*.*.*), depends on the test job, uses CI_JOB_TOKEN (no PAT needed)","Test job passes dist/index.html as an artifact to the release job"]},{version:"1.12.13",date:"2026-06-01",title:"Auto-tag on push",changes:["Pre-push hook now runs npm run build before npm test (full local validation)","Pre-push hook auto-creates an annotated version tag if one does not exist for the current package.json version","push.followTags true configured by npm install via the prepare script \u2014 tags travel with every push automatically","CLAUDE.md updated to document the tagging guarantee"]},{version:"1.12.12",date:"2026-06-01",title:"Build before test in GitLab CI",changes:["GitLab CI now runs npm run build before npm test","CI validates the build from source in a clean environment, then tests its own output rather than the committed dist file"]},{version:"1.12.11",date:"2026-06-01",title:"Link copyright footer to HidayahTech website",changes:["Copyright notice in the app footer now links to https://hidayahtech.com","Link inherits the muted footer color; accent color on hover"]},{version:"1.12.10",date:"2026-06-01",title:"Add copyright footer to app UI",changes:['Added a footer bar at the bottom of the app displaying "Copyright \xA9 2026 HidayahTech, LLC"',"Styled with --text-muted and a top border; adapts to dark mode automatically"]},{version:"1.12.9",date:"2026-06-01",title:"Add copyright notices",changes:["Added Copyright (C) 2026 HidayahTech, LLC to the top of all 24 source files (src/**/*.js, src/**/*.jsx)","build.mjs injects the notice into the generated src/lib/changelog.js so it survives rebuilds","Added copyright line to top of LICENSE file","Added License section to README.md with copyright and AGPL-3.0 reference"]},{version:"1.12.8",date:"2026-06-01",title:"Extract preparePutBody and add BUG-003 tests",changes:["Extracted preparePutBody(file) from UploadQueue.jsx into src/lib/upload-queue.js (exported)","uploadSmall now calls preparePutBody(file) instead of inlining the conversion","BUG-003 regression tests added to test/calc-part-size.test.js: returns Uint8Array, never Blob, content preserved, empty file produces empty array","Added Coverage: line for BUG-003 in BUG-LOG.md","Test count: 272 \u2192 276"]},{version:"1.12.7",date:"2026-06-01",title:"Document test suite in CLAUDE.md and update BUG-LOG",changes:['Added "Test Suite" section to CLAUDE.md: lists all 14 test files with their scope, explains the two-layer structure (unit vs build-output), and documents how to add new tests',"Updated BUG-LOG.md: added Coverage: lines to BUG-001, BUG-002, BUG-007, BUG-008, BUG-012, BUG-013, BUG-015 linking each to its implementing test file and suite"]},{version:"1.12.6",date:"2026-06-01",title:"Fill remaining test gaps",changes:["mimeType() tests added to test/media.test.js: 11 tests covering MIME type lookup, case-insensitivity, unknown/no-extension returns null, nested path handling","Upload log tests added to test/indexeddb-storage.test.js: saveUploadLogEntry, loadUploadLog (newest-first ordering, field preservation), clearUploadLog","Test count: 256 \u2192 272"]},{version:"1.12.5",date:"2026-06-01",title:"Extract corsJson and buildFileIdentityWithHash; add tests",changes:["Extracted corsJson(origin) from SetupGuide.jsx into src/lib/cors-config.js (exported)","New test/cors-config.test.js: 11 tests \u2014 structure, AllowedMethods (BUG-012), AllowedHeaders (SDK headers must be explicit), ExposeHeaders","Extracted buildFileIdentityWithHash(file) into src/lib/indexeddb.js (exported); UploadQueue.jsx now calls it instead of inlining the three-line pattern","BUG-008 regression tests added to test/indexeddb-storage.test.js: contentHash present, deterministic, content-sensitive","The SDK headers amz-sdk-invocation-id and amz-sdk-request must appear explicitly \u2014 the x-amz-* wildcard does not cover them"]},{version:"1.12.4",date:"2026-06-01",title:"Extract collectParts and add BUG-007 tests",changes:["Extracted collectParts(client, {bucket, key, uploadId}) from UploadQueue.jsx into src/lib/upload-queue.js (exported)","ListPartsCommand import moved from the component to the lib module","New test/collect-parts.test.js: 7 tests using a mock S3 client","BUG-007 regression tests: two-page and three-page pagination, stops on IsTruncated=false, handles missing Parts field, preserves ETag through pagination"]},{version:"1.12.3",date:"2026-06-01",title:"Add s3-client.js tests",changes:["New test/s3
