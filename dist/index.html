ll settled batches in one click (shown when 2+ batches are fully settled)','"Retry all failed" \u2014 re-queues every failed item across all batches (shown when any item has error status)','"Cancel all" \u2014 cancels all active and queued batches; uses the same two-click confirm pattern as per-batch cancel (shown when any upload is active or queued)','"Collapse all" / "Expand all" \u2014 toggle visibility of all batch rows at once (shown when 2+ batches exist with at least 2 in the same state)']},{group:"Upload speed display improvements",items:["Batch transfer rate now uses a rolling 6-second derivative of confirmed bytes rather than summing per-item speeds; small files (single PutObject, no progress events) contribute the same as large files (continuous multipart updates), so the rate is accurate and uniform regardless of file size",'Completed items in the per-file list now show their measured average upload speed ("\u2713 Complete \xB7 2.1 MB/s"), giving a consistent display between in-progress large files and finished small files']},{group:"Browser extension upload blocking detection",items:['Uploads blocked by ad/content blockers (uBlock Origin, etc.) now show an actionable warning rather than a cryptic network error: "Request may have been blocked by a browser extension" with guidance to disable the extension for the page or allowlist the destination domain','Detection covers all three browsers: Firefox ("NetworkError when attempting to fetch resource"), Chrome ("Failed to fetch"), Safari ("Load failed"); correctly ignored when an HTTP response was received (genuine server errors are unaffected)']},{group:"Failed upload visibility",items:["Batches containing failed items now show a red left accent border, making them immediately scannable across a long queue without expanding anything","Failed items float to the top of their batch's expanded list so they are visible without scrolling",'Batches are force-expanded the first time an error appears, so failures are never hidden behind a collapsed "Show" button']},{group:"In-app changelog grouping",items:["The changelog modal now renders a second level of hierarchy: Bold section headers in CHANGELOG.md become labelled groups with their items nested beneath them; entries without headers render as a flat list as before (no change to older releases)"]},{group:"Upload queue bug fixes",items:['Fixed page freeze (Firefox "Script terminated by timeout") caused by Preact diffing 15 000+ UploadLog rows on every queue update; upload history now renders at most 200 rows (all entries still counted for summary stats)',"Fixed upload history panel popping in and out during active uploads; the panel no longer hides after initial load",'Fixed re-dragging a previously cancelled folder showing files as "paused"; cancel now deletes the IndexedDB resume record','Fixed race condition where cancelling a batch during the resume-record lookup could set cancelled items back to "paused"']}]},{version:"1.13.22",date:"2026-06-03",title:"Remove redundant preview button from file row actions",changes:["The filename is already clickable (accent colour, underline on hover) and opens the preview modal; the separate \u2299 button in the actions column did the same thing","Removing it reduces the actions column from 5 buttons to 4"]},{version:"1.13.21",date:"2026-06-03",title:"Fix preview modal layout jank with fixed-height content stage",changes:["Preview content area now has a fixed height (clamp(300px, 70vh, 700px)) so the modal opens at full size immediately \u2014 no reflow as media loads",`Added --surface-raised background on the stage so the loading spinner and "can't preview" state appear in a clearly defined area`,"Audio previews use a compact 140px stage instead of the full height; for files with a recognised audio extension the compact height is applied immediately (no intermediate expansion)","Image and video max-height changed from 72vh to 100% \u2014 container is now the constraint","PDF height changed from 70vh to 100%; text preview fills and scrolls within the container rather than relying on its own viewport-relative max-height"]},{version:"1.13.20",date:"2026-06-03",title:"Parallelize DeleteObjectsCommand batches (3 concurrent)",changes:["Both batch-delete (selected files) and folder-delete now send up to 3 DeleteObjectsCommand requests concurrently instead of sequentially; each request still deletes up to 1000 objects (S3 API limit)","For a 10,000-object delete this reduces round-trips from 10 serial requests to 4 parallel groups \u2014 roughly 3\xD7 faster at typical provider latencies","Folder-delete uses per-batch .catch() so a single failing request does not abort the remaining batches; errors are still collected and reported"]},{version:"1.13.19",date:"2026-06-03",title:"Batch rAF-aligned updateItem calls; add slow-mock latency option",changes:["Extracted createUpdateBatcher (src/lib/update-batcher.js) \u2014 coalesces non-urgent progress patches into one setItems call per animation frame; urgent status transitions (done, error, paused, etc.) flush immediately and preserve any accumulated bytes for the same item","All 14 status-change updateItem call sites in UploadQueue.jsx now pass urgent = true; the two high-frequency updateProgress calls remain non-urgent and are coalesced per frame","Added 14 unit tests covering merge semantics, urgent/non-urgent paths, and the pending-bytes-preserved invariant (test/update-batcher.test.js)","Added MOCK_S3_LATENCY_MS env var to perf/mock-s3.mjs for realistic benchmark conditions (e.g. MOCK_S3_LATENCY_MS=20 npm run perftest)","BatchSummary self-time: 877ms \u2192 724ms (\u221217%) at 1000 files, 0ms latency"]},{version:"1.13.18",date:"2026-06-03",title:"Replace 8 filter/reduce passes in BatchSummary with a single loop",changes:["Replaced 8 separate filter/reduce calls in BatchSummary (run on every updateItem call over all queued items) with a single for...of loop that computes all counts and collects only the small renderable arrays (errorItems, pausedItems, inFlightItems); BatchSummary self-time: 1143ms \u2192 877ms (\u221223%) at 1000 files; browser idle time increased from 390ms to 716ms"]},{version:"1.13.17",date:"2026-06-03",title:"Cache formatted timestamps in UploadLog and raise bench default to 1000 files",changes:["Added module-level Map cache to formatCompletedAt in UploadLog.jsx so each timestamp is passed through toLocaleString() exactly once; subsequent renders and IndexedDB reloads are O(1) map lookups \u2014 reduced self-time from ~1378ms to ~90ms (\u221293%) at 1000 files","Changed default BENCH_FILES from 200 to 1000 in perf/bench-browser.mjs"]},{version:"1.13.16",date:"2026-06-03",title:"Throttle rAF animation loops to 15fps and skip when tab hidden",changes:["Both animation loops in UploadQueue.jsx (BatchSummary bytes counter and per-item progress) now skip state updates when document.visibilityState is 'hidden' and throttle to ~15fps (66ms gate) when visible; reduces animation overhead by ~75% during long uploads and to zero when tab is hidden"]},{version:"1.13.15",date:"2026-06-03",title:"Use version string as build-id for deterministic builds",changes:["build-id meta tag now contains the version string (e.g. 1.13.15) instead of a build timestamp; repeated builds from the same source produce identical output, eliminating the dirty dist/index.html left behind by the pre-push hook"]},{version:"1.13.14",date:"2026-06-03",title:"Debounce setLogKey to eliminate dominant CPU hotspot",changes:["Debounced onLogEntry callback in App.jsx (fires at most every 500ms) to eliminate O(N\xB2) toLocaleString() calls in UploadLog; wall-clock time for a 200-file upload dropped 30% (3862ms \u2192 2705ms), formatCompletedAt CPU self-time dropped from ~24% to ~5%"]},{version:"1.13.13",date:"2026-06-03",title:"Add performance benchmarking harness and unify build modes",changes:["Added npm run perftest \u2014 full browser benchmark using Playwright + CDP profiling against a local mock S3 server; saves .cpuprofile to perf/output/","Added npm run bench \u2014 fast algorithmic microbenchmarks (no browser required)","Unified build configuration in build.mjs with explicit --mode=prod|dev|perf; each mode determines destination directory, minification, source maps, and whether production invariants run","Simplified serve.mjs to delegate build logic to build.mjs --mode=dev","Perf builds write to perf/index.html; dist/ is never touched by benchmarks","Added data-testid attributes to upload queue file input and completion indicator"]},{version:"1.13.12",date:"2026-06-03",title:"Add design-intent documentation for all components and libraries",changes:["Added docs/intent/ documentation set (baseline v1.11.3): architecture overview, data flow, storage model, design principles, and per-module intent for all src/lib/ modules, Browser.jsx, and all other components"]},{version:"1.13.11",date:"2026-06-03",title:"Fix file concurrency setting not taking effect mid-queue",changes:["Changing the file concurrency setting while uploads are in progress had no effect because queueRef.current.concurrency was only updated in enqueueUpload (called when adding files). The Queue's _drain() kept reading the original value on every completion.","Fix: re-read loadFileConcurrency() in runUpload's finally block, which executes immediately before the Queue's own .finally() calls _drain() \u2014 so the new value is in place at exactly the right moment."]},{version:"1.13.10",date:"2026-06-03",title:"Add per-queue desktop notification mute toggle",changes:['Add "Notifs on / Notifs off" toggle button to the batch summary header. Only shown when Notification permission has been granted. Takes effect immediately on the next completed upload \u2014 a ref is checked at fire time so toggling mid-queue requires no async coordination.',"State is queue-scoped (resets when the queue is cleared) and does not affect the notification permission grant itself."]},{version:"1.13.9",date:"2026-06-03",title:"Fix profile save capturing empty fields and clearing the form",changes:["handleSaveProfile was reading from credentials state (only updated on Connect) instead of liveFormData. Result: saved profiles were empty and the form cleared immediately after saving because the key-prop change triggered a remount against the stale empty credentials.","Fix: build the profile from liveFormData; sync credentials after saving so the remounted form retains the values the user entered."]},{version:"1.13.8",date:"2026-06-03",title:"Trim surrounding whitespace from pasted credential values",changes:["Pasting a value with leading or trailing whitespace into any credential field (endpoint, bucket, key ID, secret key, region) now automatically strips the whitespace. Only intercepts pastes that actually contain surrounding whitespace \u2014 normal typing and clean pastes are unaffected. Handles partial-field paste (selection replaced) correctly via cursor position tracking."]},{version:"1.13.7",date:"2026-06-03",title:"Fix profile save button not enabling as form is filled",changes:[`"Save as profile\u2026" was always disabled while typing because ProfilePicker checked App's credentials state, which only updates on Connect \u2014 not as the user types. Fix: CredentialForm fires onFormChange on every keystroke; App tracks liveFormData and passes it to ProfilePicker instead.`]},{version:"1.13.6",date:"2026-06-03",title:"Fix Wasabi bare endpoint region auto-detection",changes:["s3.wasabisys.com (no region segment) is Wasabi's documented legacy endpoint for us-east-1. extractRegion now returns 'us-east-1' for this host instead of falling through to null and showing the manual region input."]},{version:"1.13.5",date:"2026-06-03",title:"Add serve link to file:// banner and fix banner link color",changes:['Add a "Run npm run serve for a local server" link to the file:// warning banner, pointing to the GitLab README setup section.',"Set .banner a color to --accent so links in banners are readable against both light and dark banner backgrounds."]},{version:"1.13.4",date:"2026-06-03",title:"Require valid fields before saving a profile",changes:['Disable "Save as profile\u2026" button unless endpoint is a valid URL, bucket is present (no spaces, \u2264 63 chars), and key ID is present (no spaces) \u2014 the minimum needed to make the profile useful.',"Add canSaveProfile() to credential-validation.js (pure, tested).","Disabled button shows a tooltip explaining what is needed.","Add 13 new tests for canSaveProfile covering presence, URL validity, bucket format, and key ID format."]},{version:"1.13.3",date:"2026-06-03",title:"Storage & Privacy viewer",changes:['Add "Storage & Privacy" modal (footer link, always accessible regardless of session state) showing a live snapshot of every value the app stores.',"Six collapsible sections: Connection, Saved Profiles, Upload History, Incomplete Uploads, Settings, Runtime State \u2014 each with a scoped clear action.",'Secret key shown as presence indicator only ("Present (session only)" / "Not stored") \u2014 the value is never rendered.','"Clear All App Data" removes every localStorage, sessionStorage, and IndexedDB entry the app has ever written, then reloads to a fresh state.',"New wipeAllAppData(), resetSettings(), deleteAllProfiles() in storage.js.","New loadAllResumeRecords(), clearAllResumeRecords(), deleteDatabase(), loadActiveUploads(), clearActiveUploads() in indexeddb.js.","Storage catalog documented in docs/storage-catalog.md; feature design in docs/design-storage-viewer.md."]},{version:"1.13.2",date:"2026-06-03",title:"Fix saved profile not populating form fields on load",changes:["Fix: selecting a saved profile after disconnect left the credential form blank. Root cause: credentials state was initialized before selectedProfileId, so the initializer had no profile to draw from. Fix: declare selectedProfileId first, then seed credentials from the matched profile when one is restored.","Mount useEffect now uses profile data as the base for auto-connect, matching the same lookup order as the initializer."]},{version:"1.13.1",date:"2026-06-03",title:"Credential field validation and storage write-boundary enforcement (BUG-016)",changes:["Add repairStorageInvariants(): runs on every mount before migration; clears s3b_provider if it contains whitespace or exceeds 20 chars; repairs stored profiles with corrupted provider field. Idempotent no-op once data is clean.","loadCredentials(): sanitize provider on read \u2014 return null for any value that fails the identifier check, so corrupted data never enters app state","saveCredentials(): sanitize provider on write \u2014 write '' if the value is not a valid short identifier, so corruption cannot be re-persisted","readUrlParams(): validate provider hash param before accepting \u2014 ignore any value containing whitespace or exceeding 20 chars","CredentialForm: inline validation errors block submit when key ID, secret key, bucket, or region contain whitespace; warn when bucket exceeds 63 characters","Extract credentialErrors() to src/lib/credential-validation.js (pure, tested)","Add 27 new tests across storage, url-params, and credential-validation suites"]},{version:"1.13.0",date:"2026-06-02",title:"Multi-profile credential management",changes:["Add named profile storage: save N connection profiles (endpoint, bucket, key ID, provider) to localStorage; secret key is never stored","Profile picker on connect screen: select a saved profile to pre-fill the form",'"Save as profile" explicit action with user-defined display name',"Delete profile from picker","Silent migration: existing credentials become a named default profile on first load","Current profile name shown in connected sidebar","Storage layer: versioned envelope ({ version: 1, profiles: [] }), upsert primitive, tolerant loading (unknown fields preserved for forward compatibility)","Profile keys stored outside LS_KEYS so clearCredentials() does not wipe them on disconnect"]},{version:"1.12.24",date:"2026-06-02",title:"Make background update check toggleable in settings",changes:["Add loadUpdateCheckEnabled / saveUpdateCheckEnabled to storage.js","UpdateBanner accepts enabled prop; polling starts/stops reactively via useEffect dependency",'SettingsPanel exposes a "Background update checks" checkbox with immediate effect (no Save needed)',"Defaults to enabled \u2014 no behaviour change for existing users"]},{version:"1.12.23",date:"2026-06-02",title:"Add live instance link and canonical repo note to README",changes:['Add "Try it live" link to bucketer.hidayahtech.net and canonical GitLab repo reference below the badges']},{version:"1.12.22",date:"2026-06-02",title:"Add About modal and expand README intro",changes:["Add AboutModal component with five-pitch product overview and personal author note",'About modal accessible from footer "About" link and splash screen "Learn more \u2192"','Splash screen "About Bucketer" section replaced with full narrative description',"README intro rebuilt: five-pitch marketing section, narrative, author note with Palestine solidarity statement","Save prose narrative to docs/narrative-description.md for reuse elsewhere"]},{version:"1.12.21",date:"2026-06-02",title:"Expand app title to full descriptive name",changes:["Set appTitle constant in build.mjs as single source for <title>, og:title, and twitter:title",'Title is now "Bucketer \u2014 In-Browser S3-Compatible Bucket Manager" across all three tags']},{version:"1.12.20",date:"2026-06-02",title:"Add Open Graph meta tags and OG preview image",changes:["Add og:title, og:description, og:image, og:url, and Twitter Card meta tags to src/index.html","Add src/assets/og-image.png (1200\xD7630, optimized with oxipng) for link preview cards","Update build.mjs to copy og-image.png to dist/ on every build"]},{version:"1.12.19",date:"2026-06-02",title:"Inline header logo as component",changes:["Convert header logo from static <img> to inline Preact component","Bump logo size to 3rem for better visibility"]},{version:"1.12.18",date:"2026-06-01",title:"Update footer with Bucketer repo link",changes:['Footer now reads "Bucketer \u2014 Copyright \xA9 2026 HidayahTech, LLC"','"Bucketer" links to the canonical GitLab repo so visitors can find the source']},{version:"1.12.17",date:"2026-06-01",title:"Fix version tag push timing",changes:["Fix pre-push hook so version tags are pushed immediately rather than one commit late","Hook now explicitly pushes the new tag itself instead of relying on push.followTags","Tag-only recursive pushes skip the build/test cycle to avoid redundant work"]},{version:"1.12.16",date:"2026-06-01",title:"Upstream release check in changelog",changes:['Add "Check for upstream release" button to the changelog modal',"Fetches the latest GitLab release via API and displays the release badge alongside a status line (up to date / update available with link)","Result is cached for the duration of the tab session"]},{version:"1.12.15",date:"2026-06-01",title:"README badges",changes:["Add pipeline status, latest release, and AGPL v3 license badges to README"]},{version:"1.12.14",date:"2026-06-01",title:"CI release job",changes:["Added scripts/release.mjs \u2014 uploads dist/index.html to the Package Registry and creates a GitLab Release with CHANGELOG description and asset link",".gitlab-ci.yml now has two stages: test and release","Release job runs only on version tags (v*.*.*), depends on the test job, uses CI_JOB_TOKEN (no PAT needed)","Test job passes dist/index.html as an artifact to the release job"]},{version:"1.12.13",date:"2026-06-01",title:"Auto-tag on push",changes:["Pre-push hook now runs npm run build before npm test (full local validation)","Pre-push hook auto-creates an annotated version tag if one does not exist for the current package.json version","push.followTags true configured by npm install via the prepare script \u2014 tags travel with every push automatically","CLAUDE.md updated to document the tagging guarantee"]},{version:"1.12.12",date:"2026-06-01",title:"Build before test in GitLab CI",changes:["GitLab CI now runs npm run build before npm test","CI validates the build from source in a clean environment, then tests its own output rather than the committed dist file"]},{version:"1.12.11",date:"2026-06-01",title:"Link copyright footer to HidayahTech website",changes:["Copyright notice in the app footer now links to https://hidayahtech.com","Link inherits the muted footer color; accent color on hover"]},{version:"1.12.10",date:"2026-06-01",title:"Add copyright footer to app UI",changes:['Added a footer bar at the bottom of the app displaying "Copyright \xA9 2026 HidayahTech, LLC"',"Styled with --text-muted and a top border; adapts to dark mode automatically"]},{version:"1.12.9",date:"2026-06-01",title:"Add copyright notices",changes:["Added Copyright (C) 2026 HidayahTech, LLC to the top of all 24 source files (src/**/*.js, src/**/*.jsx)","build.mjs injects the notice into the generated src/lib/changelog.js so it survives rebuilds","Added copyright line to top of LICENSE file","Added License section to README.md with copyright and AGPL-3.0 reference"]},{version:"1.12.8",date:"2026-06-01",title:"Extract preparePutBody and add BUG-003 tests",changes:["Extracted preparePutBody(file) from UploadQueue.jsx into src/lib/upload-queue.js (exported)","uploadSmall now calls preparePutBody(file) instead of inlining the conversion","BUG-003 regression tests added to test/calc-part-size.test.js: returns Uint8Array, never Blob, content preserved, empty file produces empty array","Added Coverage: line for BUG-003 in BUG-LOG.md","Test count: 272 \u2192 276"]},{version:"1.12.7",date:"2026-06-01",title:"Document test suite in CLAUDE.md and update BUG-LOG",changes:['Added "Test Suite" section to CLAUDE.md: lists all 14 test files with their scope, explains the two-layer structure (unit vs build-output), and documents how to add new tests',"Updated BUG-LOG.md: added Coverage: lines to BUG-001, BUG-002, BUG-007, BUG-008, BUG-012, BUG-013, BUG-015 linking each to its implementing test file and suite"]},{version:"1.12.6",date:"2026-06-01",title:"Fill remaining test gaps",changes:["mimeType() tests added to test/media.test.js: 11 tests covering MIME type lookup, case-insensitivity, unknown/no-extension returns null, nested path handling","Upload log tests added to test/indexeddb-storage.test.js: saveUploadLogEntry, loadUploadLog (newest-first ordering, field preservation), clearUploadLog","Test count: 256 \u2192 272"]},{version:"1.12.5",date:"2026-06-01",title:"Extract corsJson and buildFileIdentityWithHash; add tests",changes:["Extracted corsJson(origin) from SetupGuide.jsx into src/lib/cors-config.js (exported)","New test/cors-config.test.js: 11 tests \u2014 structure, AllowedMethods (BUG-012), AllowedHeaders (SDK headers must be explicit), ExposeHeaders","Extracted buildFileIdentityWithHash(file) into src/lib/indexeddb.js (exported); UploadQueue.jsx now calls it instead of inlining the three-line pattern","BUG-008 regression tests added to test/indexeddb-storage.test.js: contentHash present, deterministic, content-sensitive","The SDK headers amz-sdk-invocation-id and amz-sdk-request must appear explicitly \u2014 the x-amz-* wildcard does not cover them"]},{version:"1.12.4",date:"2026-06-01",title:"Extract collectParts and add BUG-007 tests",changes:["Extracted collectParts(client, {bucket, key, uploadId}) from UploadQueue.jsx into src/lib/upload-queue.js (exported)","ListPartsCommand import moved from the component to the lib module","New test/collect-parts.test.js: 7 tests using a mock S3 client","BUG-007 regression tests: two-page and three-page pagination, stops on IsTruncated=false, handles missing Parts field, preserves ETag through pagination"]},{version:"1.12.3",date:"2026-06-01",title:"Add s3-client.js tests",changes:["New test/s3-client.test.js: 12 tests for createS3Client region resolution and forcePathStyle","Region priority: regionOverride > extractRegion() > us-east-1 fallback; all three tiers tested","R2 region is always auto; B2 and AWS extract from endpoint subdomain","forcePathStyle true for B2 and MinIO; false for R2, AWS, generic"]},{version:"1.12.2",date:"2026-06-01",title:"Add file-entries.js tests",changes:["New test/file-entries.test.js: 10 tests for collectFileEntries using a pure JS FileSystemEntry mock","Flat list, nested folder traversal, mixed root entries, and correct relative path construction","Pagination invariant: folders with 150 and 250 files (simulated with batches of 100) must collect all entries \u2014 not just the first 100","Error resilience: unreadable file entries are silently skipped without throwing"]},{version:"1.12.1",date:"2026-06-01",title:"Add storage.js tests",changes:["New test/storage.test.js: 23 tests covering the full credential and settings persistence layer","Security invariant: secretKey must go to sessionStorage, not localStorage; asserted at the storage-value level","Credential round-trip: all fields saved and loaded correctly; provider returns null (not empty string) when absent","clearCredentials wipes both stores; clearCapabilities resets to defaults","Settings round-trips for all settings functions: maxKeys, partConcurrency, partSizeMB, fileConcurrency","listingCacheTTL edge case: 0 (disable cache) must not be treated as falsy \u2014 checked explicitly","loadCapabilities returns defaults when storage is empty or contains corrupted JSON"]},{version:"1.12.0",date:"2026-06-01",title:"IndexedDB resume record and file hash tests",changes:["Added fake-indexeddb as devDependency to provide an in-memory IndexedDB in Node","New test/indexeddb-storage.test.js: 11 tests covering saveResumeRecord, loadResumeRecord, deleteResumeRecord, and computeFileHash","Resume record tests: round-trip fidelity, null return for missing key, overwrite at same key, independent keys","Delete tests: removal confirmed, no-op delete resolves cleanly, sibling keys are preserved","computeFileHash tests: determinism, content sensitivity, and the partial-hash invariant (only head+tail 64 KB are hashed \u2014 two files with identical endpoints but different middle produce the same hash)"]},{version:"1.11.9",date:"2026-06-01",title:"Extract calcPartSize and add tests",changes:["Moved calcPartSize from UploadQueue.jsx into src/lib/upload-queue.js (exported) so it can be tested without loading JSX","New test/calc-part-size.test.js: 11 tests covering the 5 MB floor, 10,000-part ceiling, preferred size override, and falsy preferred values","Also fixed test/build.test.js to operate on the HTML frame and JS bundle separately \u2014 whole-file string matching produced false positives when changelog text contained tag-like strings as data"]},{version:"1.11.8",date:"2026-06-01",title:"Add build output structural tests",changes:["New test/build.test.js: 14 assertions on dist/index.html verifying production build invariants","BUG-001 regression: placeholder must not survive into dist; output must be a valid HTML document","BUG-002 regression: Preact JSX transform must be active; no React runtime artifacts in output","BUG-012 regression: CORS template must include DELETE in AllowedMethods","Version consistency: app-version meta tag must match package.json version","Single-bundle assertions: HTML frame has no injected tags before the bundle; no external script or stylesheet references"]},{version:"1.11.7",date:"2026-06-01",title:"Add indexeddb pure-function tests",changes:["New test/indexeddb-pure.test.js: 18 tests covering pure functions and localStorage-based tab conflict detection","BUG-015 regression tests: uploadExpiryWarningMs('b2') must return null; R2 and generic must return 7 days","buildFileIdentity and fileIdentityMatches: identity construction and all three mismatch cases","Tab conflict detection: this-tab vs other-tab discrimination, inactive cleanup, multi-key independence, other-tab entry not removed by this tab's markU
