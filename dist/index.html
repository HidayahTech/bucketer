tored outside LS_KEYS so clearCredentials() does not wipe them on disconnect"]},{version:"1.12.24",date:"2026-06-02",title:"Make background update check toggleable in settings",changes:["Add loadUpdateCheckEnabled / saveUpdateCheckEnabled to storage.js","UpdateBanner accepts enabled prop; polling starts/stops reactively via useEffect dependency",'SettingsPanel exposes a "Background update checks" checkbox with immediate effect (no Save needed)',"Defaults to enabled \u2014 no behaviour change for existing users"]},{version:"1.12.23",date:"2026-06-02",title:"Add live instance link and canonical repo note to README",changes:['Add "Try it live" link to bucketer.hidayahtech.net and canonical GitLab repo reference below the badges']},{version:"1.12.22",date:"2026-06-02",title:"Add About modal and expand README intro",changes:["Add AboutModal component with five-pitch product overview and personal author note",'About modal accessible from footer "About" link and splash screen "Learn more \u2192"','Splash screen "About Bucketer" section replaced with full narrative description',"README intro rebuilt: five-pitch marketing section, narrative, author note with Palestine solidarity statement","Save prose narrative to docs/narrative-description.md for reuse elsewhere"]},{version:"1.12.21",date:"2026-06-02",title:"Expand app title to full descriptive name",changes:["Set appTitle constant in build.mjs as single source for <title>, og:title, and twitter:title",'Title is now "Bucketer \u2014 In-Browser S3-Compatible Bucket Manager" across all three tags']},{version:"1.12.20",date:"2026-06-02",title:"Add Open Graph meta tags and OG preview image",changes:["Add og:title, og:description, og:image, og:url, and Twitter Card meta tags to src/index.html","Add src/assets/og-image.png (1200\xD7630, optimized with oxipng) for link preview cards","Update build.mjs to copy og-image.png to dist/ on every build"]},{version:"1.12.19",date:"2026-06-02",title:"Inline header logo as component",changes:["Convert header logo from static <img> to inline Preact component","Bump logo size to 3rem for better visibility"]},{version:"1.12.18",date:"2026-06-01",title:"Update footer with Bucketer repo link",changes:['Footer now reads "Bucketer \u2014 Copyright \xA9 2026 HidayahTech, LLC"','"Bucketer" links to the canonical GitLab repo so visitors can find the source']},{version:"1.12.17",date:"2026-06-01",title:"Fix version tag push timing",changes:["Fix pre-push hook so version tags are pushed immediately rather than one commit late","Hook now explicitly pushes the new tag itself instead of relying on push.followTags","Tag-only recursive pushes skip the build/test cycle to avoid redundant work"]},{version:"1.12.16",date:"2026-06-01",title:"Upstream release check in changelog",changes:['Add "Check for upstream release" button to the changelog modal',"Fetches the latest GitLab release via API and displays the release badge alongside a status line (up to date / update available with link)","Result is cached for the duration of the tab session"]},{version:"1.12.15",date:"2026-06-01",title:"README badges",changes:["Add pipeline status, latest release, and AGPL v3 license badges to README"]},{version:"1.12.14",date:"2026-06-01",title:"CI release job",changes:["Added scripts/release.mjs \u2014 uploads dist/index.html to the Package Registry and creates a GitLab Release with CHANGELOG description and asset link",".gitlab-ci.yml now has two stages: test and release","Release job runs only on version tags (v*.*.*), depends on the test job, uses CI_JOB_TOKEN (no PAT needed)","Test job passes dist/index.html as an artifact to the release job"]},{version:"1.12.13",date:"2026-06-01",title:"Auto-tag on push",changes:["Pre-push hook now runs npm run build before npm test (full local validation)","Pre-push hook auto-creates an annotated version tag if one does not exist for the current package.json version","push.followTags true configured by npm install via the prepare script \u2014 tags travel with every push automatically","CLAUDE.md updated to document the tagging guarantee"]},{version:"1.12.12",date:"2026-06-01",title:"Build before test in GitLab CI",changes:["GitLab CI now runs npm run build before npm test","CI validates the build from source in a clean environment, then tests its own output rather than the committed dist file"]},{version:"1.12.11",date:"2026-06-01",title:"Link copyright footer to HidayahTech website",changes:["Copyright notice in the app footer now links to https://hidayahtech.com","Link inherits the muted footer color; accent color on hover"]},{version:"1.12.10",date:"2026-06-01",title:"Add copyright footer to app UI",changes:['Added a footer bar at the bottom of the app displaying "Copyright \xA9 2026 HidayahTech, LLC"',"Styled with --text-muted and a top border; adapts to dark mode automatically"]},{version:"1.12.9",date:"2026-06-01",title:"Add copyright notices",changes:["Added Copyright (C) 2026 HidayahTech, LLC to the top of all 24 source files (src/**/*.js, src/**/*.jsx)","build.mjs injects the notice into the generated src/lib/changelog.js so it survives rebuilds","Added copyright line to top of LICENSE file","Added License section to README.md with copyright and AGPL-3.0 reference"]},{version:"1.12.8",date:"2026-06-01",title:"Extract preparePutBody and add BUG-003 tests",changes:["Extracted preparePutBody(file) from UploadQueue.jsx into src/lib/upload-queue.js (exported)","uploadSmall now calls preparePutBody(file) instead of inlining the conversion","BUG-003 regression tests added to test/calc-part-size.test.js: returns Uint8Array, never Blob, content preserved, empty file produces empty array","Added Coverage: line for BUG-003 in BUG-LOG.md","Test count: 272 \u2192 276"]},{version:"1.12.7",date:"2026-06-01",title:"Document test suite in CLAUDE.md and update BUG-LOG",changes:['Added "Test Suite" section to CLAUDE.md: lists all 14 test files with their scope, explains the two-layer structure (unit vs build-output), and documents how to add new tests',"Updated BUG-LOG.md: added Coverage: lines to BUG-001, BUG-002, BUG-007, BUG-008, BUG-012, BUG-013, BUG-015 linking each to its implementing test file and suite"]},{version:"1.12.6",date:"2026-06-01",title:"Fill remaining test gaps",changes:["mimeType() tests added to test/media.test.js: 11 tests covering MIME type lookup, case-insensitivity, unknown/no-extension returns null, nested path handling","Upload log tests added to test/indexeddb-storage.test.js: saveUploadLogEntry, loadUploadLog (newest-first ordering, field preservation), clearUploadLog","Test count: 256 \u2192 272"]},{version:"1.12.5",date:"2026-06-01",title:"Extract corsJson and buildFileIdentityWithHash; add tests",changes:["Extracted corsJson(origin) from SetupGuide.jsx into src/lib/cors-config.js (exported)","New test/cors-config.test.js: 11 tests \u2014 structure, AllowedMethods (BUG-012), AllowedHeaders (SDK headers must be explicit), ExposeHeaders","Extracted buildFileIdentityWithHash(file) into src/lib/indexeddb.js (exported); UploadQueue.jsx now calls it instead of inlining the three-line pattern","BUG-008 regression tests added to test/indexeddb-storage.test.js: contentHash present, deterministic, content-sensitive","The SDK headers amz-sdk-invocation-id and amz-sdk-request must appear explicitly \u2014 the x-amz-* wildcard does not cover them"]},{version:"1.12.4",date:"2026-06-01",title:"Extract collectParts and add BUG-007 tests",changes:["Extracted collectParts(client, {bucket, key, uploadId}) from UploadQueue.jsx into src/lib/upload-queue.js (exported)","ListPartsCommand import moved from the component to the lib module","New test/collect-parts.test.js: 7 tests using a mock S3 client","BUG-007 regression tests: two-page and three-page pagination, stops on IsTruncated=false, handles missing Parts field, preserves ETag through pagination"]},{version:"1.12.3",date:"2026-06-01",title:"Add s3-client.js tests",changes:["New test/s3-client.test.js: 12 tests for createS3Client region resolution and forcePathStyle","Region priority: regionOverride > extractRegion() > us-east-1 fallback; all three tiers tested","R2 region is always auto; B2 and AWS extract from endpoint subdomain","forcePathStyle true for B2 and MinIO; false for R2, AWS, generic"]},{version:"1.12.2",date:"2026-06-01",title:"Add file-entries.js tests",changes:["New test/file-entries.test.js: 10 tests for collectFileEntries using a pure JS FileSystemEntry mock","Flat list, nested folder traversal, mixed root entries, and correct relative path construction","Pagination invariant: folders with 150 and 250 files (simulated with batches of 100) must collect all entries \u2014 not just the first 100","Error resilience: unreadable file entries are silently skipped without throwing"]},{version:"1.12.1",date:"2026-06-01",title:"Add storage.js tests",changes:["New test/storage.test.js: 23 tests covering the full credential and settings persistence layer","Security invariant: secretKey must go to sessionStorage, not localStorage; asserted at the storage-value level","Credential round-trip: all fields saved and loaded correctly; provider returns null (not empty string) when absent","clearCredentials wipes both stores; clearCapabilities resets to defaults","Settings round-trips for all settings functions: maxKeys, partConcurrency, partSizeMB, fileConcurrency","listingCacheTTL edge case: 0 (disable cache) must not be treated as falsy \u2014 checked explicitly","loadCapabilities returns defaults when storage is empty or contains corrupted JSON"]},{version:"1.12.0",date:"2026-06-01",title:"IndexedDB resume record and file hash tests",changes:["Added fake-indexeddb as devDependency to provide an in-memory IndexedDB in Node","New test/indexeddb-storage.test.js: 11 tests covering saveResumeRecord, loadResumeRecord, deleteResumeRecord, and computeFileHash","Resume record tests: round-trip fidelity, null return for missing key, overwrite at same key, independent keys","Delete tests: removal confirmed, no-op delete resolves cleanly, sibling keys are preserved","computeFileHash tests: determinism, content sensitivity, and the partial-hash invariant (only head+tail 64 KB are hashed \u2014 two files with identical endpoints but different middle produce the same hash)"]},{version:"1.11.9",date:"2026-06-01",title:"Extract calcPartSize and add tests",changes:["Moved calcPartSize from UploadQueue.jsx into src/lib/upload-queue.js (exported) so it can be tested without loading JSX","New test/calc-part-size.test.js: 11 tests covering the 5 MB floor, 10,000-part ceiling, preferred size override, and falsy preferred values","Also fixed test/build.test.js to operate on the HTML frame and JS bundle separately \u2014 whole-file string matching produced false positives when changelog text contained tag-like strings as data"]},{version:"1.11.8",date:"2026-06-01",title:"Add build output structural tests",changes:["New test/build.test.js: 14 assertions on dist/index.html verifying production build invariants","BUG-001 regression: placeholder must not survive into dist; output must be a valid HTML document","BUG-002 regression: Preact JSX transform must be active; no React runtime artifacts in output","BUG-012 regression: CORS template must include DELETE in AllowedMethods","Version consistency: app-version meta tag must match package.json version","Single-bundle assertions: HTML frame has no injected tags before the bundle; no external script or stylesheet references"]},{version:"1.11.7",date:"2026-06-01",title:"Add indexeddb pure-function tests",changes:["New test/indexeddb-pure.test.js: 18 tests covering pure functions and localStorage-based tab conflict detection","BUG-015 regression tests: uploadExpiryWarningMs('b2') must return null; R2 and generic must return 7 days","buildFileIdentity and fileIdentityMatches: identity construction and all three mismatch cases","Tab conflict detection: this-tab vs other-tab discrimination, inactive cleanup, multi-key i
