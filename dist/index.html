        .bk-icon-inner { transform-box: fill-box; transform-origin: center; }

        /* Per-icon vectors pointing from each icon's center to the hole at (24, 87).
           Values are in the icon's local (rotated) coordinate space so the icon
           lands on the hole in world space despite its parent rotation. */
        .bk-icon-1 .bk-icon-inner { --tx: -11px; --ty: 31px; }
        .bk-icon-2 .bk-icon-inner { --tx: -34px; --ty: 42px; }
        .bk-icon-3 .bk-icon-inner { --tx: -20px; --ty: 17px; }
        .bk-icon-4 .bk-icon-inner { --tx:  -6px; --ty:  7px; }
        .bk-icon-5 .bk-icon-inner { --tx: -43px; --ty:  7px; }
        .bk-icon-6 .bk-icon-inner { --tx: -29px; --ty:  0px; }

        /* Hole \u2014 visible during leak, mop, bandage; hidden during refill + full */
        .bk-hole { opacity: 0; transition: opacity 0.3s; }
        .logo-phase-leak    .bk-hole,
        .logo-phase-mop     .bk-hole,
        .logo-phase-bandage .bk-hole { opacity: 1; }

        /* Drip animation \u2014 6 staggered drips during leak */
        .bk-drip { opacity: 0; }
        .logo-phase-leak .bk-drip-1 { animation: bk-drip 0.6s ease-in 0.5s forwards; }
        .logo-phase-leak .bk-drip-2 { animation: bk-drip 0.6s ease-in 1.3s forwards; }
        .logo-phase-leak .bk-drip-3 { animation: bk-drip 0.6s ease-in 2.1s forwards; }
        .logo-phase-leak .bk-drip-4 { animation: bk-drip 0.6s ease-in 2.9s forwards; }
        .logo-phase-leak .bk-drip-5 { animation: bk-drip 0.6s ease-in 3.7s forwards; }
        .logo-phase-leak .bk-drip-6 { animation: bk-drip 0.6s ease-in 4.5s forwards; }

        @keyframes bk-drip {
          0%   { opacity: 1; transform: translateY(0); }
          85%  { opacity: 1; transform: translateY(28px); }
          100% { opacity: 0; transform: translateY(30px); }
        }

        /* Icons \u2014 drain (shrink + fade) sequentially during leak */
        .logo-phase-leak .bk-icon-1 .bk-icon-inner { animation: bk-drain 0.85s ease-in 0.2s forwards; }
        .logo-phase-leak .bk-icon-2 .bk-icon-inner { animation: bk-drain 0.85s ease-in 1.0s forwards; }
        .logo-phase-leak .bk-icon-3 .bk-icon-inner { animation: bk-drain 0.85s ease-in 1.8s forwards; }
        .logo-phase-leak .bk-icon-4 .bk-icon-inner { animation: bk-drain 0.85s ease-in 2.6s forwards; }
        .logo-phase-leak .bk-icon-5 .bk-icon-inner { animation: bk-drain 0.85s ease-in 3.4s forwards; }
        .logo-phase-leak .bk-icon-6 .bk-icon-inner { animation: bk-drain 0.85s ease-in 4.2s forwards; }

        /* During mop and bandage, icons stay hidden */
        .logo-phase-mop     .bk-icon-inner,
        .logo-phase-bandage .bk-icon-inner { opacity: 0; transform: scale(0); }

        @keyframes bk-drain {
          0%   { opacity: 1; transform: translate(0, 0) scale(1); }
          70%  { opacity: 1; transform: translate(calc(var(--tx) * 0.85), calc(var(--ty) * 0.85)) scale(0.65); }
          100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.05); }
        }

        /* Puddle \u2014 6 stacked ellipses, each fades in as a drip lands */
        .bk-puddle { opacity: 0; }
        .logo-phase-leak .bk-puddle-1 { animation: bk-puddle 0.3s ease-out 1.0s forwards; }
        .logo-phase-leak .bk-puddle-2 { animation: bk-puddle 0.3s ease-out 1.8s forwards; }
        .logo-phase-leak .bk-puddle-3 { animation: bk-puddle 0.3s ease-out 2.6s forwards; }
        .logo-phase-leak .bk-puddle-4 { animation: bk-puddle 0.3s ease-out 3.4s forwards; }
        .logo-phase-leak .bk-puddle-5 { animation: bk-puddle 0.3s ease-out 4.2s forwards; }
        .logo-phase-leak .bk-puddle-6 { animation: bk-puddle 0.3s ease-out 5.0s forwards; }

        /* During mop, each puddle ring fades out timed to a mop plunge */
        .logo-phase-mop .bk-puddle { opacity: 0.55; }
        .logo-phase-mop .bk-puddle-6 { animation: bk-puddle-fade 0.25s ease-out 0.55s forwards; }
        .logo-phase-mop .bk-puddle-5 { animation: bk-puddle-fade 0.25s ease-out 0.85s forwards; }
        .logo-phase-mop .bk-puddle-4 { animation: bk-puddle-fade 0.25s ease-out 1.25s forwards; }
        .logo-phase-mop .bk-puddle-3 { animation: bk-puddle-fade 0.25s ease-out 1.55s forwards; }
        .logo-phase-mop .bk-puddle-2 { animation: bk-puddle-fade 0.25s ease-out 1.85s forwards; }
        .logo-phase-mop .bk-puddle-1 { animation: bk-puddle-fade 0.25s ease-out 2.15s forwards; }

        @keyframes bk-puddle {
          0%   { opacity: 0; }
          100% { opacity: 0.55; }
        }

        @keyframes bk-puddle-fade {
          0%   { opacity: 0.55; }
          100% { opacity: 0; }
        }

        /* Mop \u2014 enters from right, attacks puddle at three spots with angled plunges */
        .bk-mop { opacity: 0; transform: translate(60px, 0) rotate(0deg); transform-box: fill-box; transform-origin: 50% 0%; }
        .logo-phase-mop .bk-mop { animation: bk-mop 2.4s ease-in-out 0.15s forwards; }

        @keyframes bk-mop {
          0%   { opacity: 0; transform: translate(60px, 0) rotate(0deg); }
          8%   { opacity: 1; transform: translate(28px, 0)  rotate(0deg); }

          /* Right attack: two angled plunges */
          16%  { opacity: 1; transform: translate(26px, 2px) rotate(-22deg); }
          22%  { opacity: 1; transform: translate(28px, 0)   rotate(14deg); }
          28%  { opacity: 1; transform: translate(26px, 2px) rotate(-18deg); }

          /* Travel to center */
          35%  { opacity: 1; transform: translate(6px, -1px) rotate(0deg); }

          /* Center attack: two angled plunges */
          43%  { opacity: 1; transform: translate(4px, 2px)  rotate(20deg); }
          50%  { opacity: 1; transform: translate(8px, 0)    rotate(-16deg); }
          57%  { opacity: 1; transform: translate(4px, 2px)  rotate(18deg); }

          /* Travel to left */
          65%  { opacity: 1; transform: translate(-16px, -1px) rotate(0deg); }

          /* Left attack: two angled plunges */
          73%  { opacity: 1; transform: translate(-18px, 2px) rotate(-20deg); }
          80%  { opacity: 1; transform: translate(-14px, 0)   rotate(16deg); }
          87%  { opacity: 1; transform: translate(-18px, 2px) rotate(-14deg); }

          /* Exit left */
          95%  { opacity: 1; transform: translate(-50px, 0)  rotate(0deg); }
          100% { opacity: 0; transform: translate(-70px, 0)  rotate(0deg); }
        }

        /* Refill \u2014 icons drop in from above the rim, sequentially */
        .logo-phase-refill .bk-icon-1 .bk-icon-inner { animation: bk-settle 0.9s cubic-bezier(.34,1.5,.64,1) 0.0s backwards; }
        .logo-phase-refill .bk-icon-2 .bk-icon-inner { animation: bk-settle 0.9s cubic-bezier(.34,1.5,.64,1) 0.4s backwards; }
        .logo-phase-refill .bk-icon-3 .bk-icon-inner { animation: bk-settle 0.9s cubic-bezier(.34,1.5,.64,1) 0.8s backwards; }
        .logo-phase-refill .bk-icon-4 .bk-icon-inner { animation: bk-settle 0.9s cubic-bezier(.34,1.5,.64,1) 1.2s backwards; }
        .logo-phase-refill .bk-icon-5 .bk-icon-inner { animation: bk-settle 0.9s cubic-bezier(.34,1.5,.64,1) 1.6s backwards; }
        .logo-phase-refill .bk-icon-6 .bk-icon-inner { animation: bk-settle 0.9s cubic-bezier(.34,1.5,.64,1) 2.0s backwards; }

        @keyframes bk-settle {
          0%   { opacity: 0; transform: translateY(-70px) scale(1); }
          70%  { opacity: 1; transform: translateY(2px) scale(1); }
          100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Bandages \u2014 slide in from the left during the bandage phase, form an X */
        .bk-bandaid { opacity: 0; transform-box: fill-box; transform-origin: center; }

        /* Final resting state, visible whenever patched */
        .bk-patched.logo-phase-full   .bk-bandaid-1,
        .bk-patched.logo-phase-refill .bk-bandaid-1 { opacity: 1; transform: translateX(0) rotate(45deg); }
        .bk-patched.logo-phase-full   .bk-bandaid-2,
        .bk-patched.logo-phase-refill .bk-bandaid-2 { opacity: 1; transform: translateX(0) rotate(-45deg); }

        /* Bandage phase: slide in sequentially from the left */
        .bk-patched.logo-phase-bandage .bk-bandaid-1 {
          animation: bk-bandaid-in-1 0.5s cubic-bezier(.34,1.3,.64,1) 0.15s forwards;
        }
        .bk-patched.logo-phase-bandage .bk-bandaid-2 {
          animation: bk-bandaid-in-2 0.5s cubic-bezier(.34,1.3,.64,1) 0.65s forwards;
        }

        @keyframes bk-bandaid-in-1 {
          0%   { opacity: 0; transform: translateX(-50px) rotate(45deg); }
          70%  { opacity: 1; transform: translateX(3px)   rotate(45deg); }
          100% { opacity: 1; transform: translateX(0)     rotate(45deg); }
        }
        @keyframes bk-bandaid-in-2 {
          0%   { opacity: 0; transform: translateX(-50px) rotate(-45deg); }
          70%  { opacity: 1; transform: translateX(3px)   rotate(-45deg); }

 cors-blocked verdict now suggests double-checking the bucket name, since wildcard-DNS providers (AWS, R2) answer probes even for buckets that don't exist (#52).","Error blocks inside a working session (listing, download, hidden versions) get a softer verdict when all probes pass: a transient network interruption is more likely than a CORS problem on a connection that was already working \u2014 retry first (#52)."]},{version:"1.38.2",date:"2026-07-26",title:"In-app changelog no longer truncates wrapped bullets (#50, BUG-044)",changes:["The changelog modal now shows each bullet's full text. The build-time parser dropped a wrapped bullet's continuation lines, truncating every release's blurb at its first physical line; continuation lines are now joined back into the bullet, restoring ~20 KB of history across all 128 entries at once."]},{version:"1.38.1",date:"2026-07-26",title:"B2 Setup Guide CORS command fixed (BUG-043)",changes:[`The B2 Setup Guide's put-bucket-cors command no longer fails with "illegal '*' in an exposeHeaders value". B2 rejects wildcards in ExposeHeaders (unlike AWS), so the generated config now lists the app's meta headers explicitly (x-amz-meta-bucketer-content-hash, x-amz-meta-file-mtime) for B2 while other providers keep the x-amz-meta-* wildcard that keeps arbitrary object metadata readable.`]},{version:"1.38.0",date:"2026-07-26",title:"Connection diagnostics",changes:['New Run diagnostics button turns masked network errors into one precise verdict. Available on connect-screen, listing, download, and hidden-versions errors. Runs static checks (offline, mixed content, URL validity) plus unauthenticated no-cors reachability probes of the endpoint and bucket hostname \u2014 e.g. "endpoint unreachable" vs. "almost certainly missing CORS configuration" \u2014 instead of the generic three-way guess. Nothing runs until clicked; credentials are never attached to probes.']},{version:"1.37.5",date:"2026-07-12",title:"Mobile: long filenames no longer push actions off-screen (BUG-042)",changes:["Fixed: on phone viewports, a row with a long filename forced the whole file table wider than the screen \u2014 part of the rename button was cut off and the remaining per-row actions were only reachable by scrolling sideways (reported from Firefox Android reviewing v1.37.3; probe-verified identical on Chromium \u2014 the desktop nowrap+ellipsis name treatment cannot shrink inside a table, so one long name set the column's minimum width). At \u2264640px filenames now wrap across lines instead of truncating, so the table always fits the viewport.","Internal: the mobile e2e now seeds a 64-character filename and asserts every action button in that row sits inside the viewport (bounding-box checks \u2014 page scrollWidth cannot see this overflow class because an inner wrapper scrolls, not the document)."]},{version:"1.37.4",date:"2026-07-12",title:"Drag-drop uploads no longer die silently on entry failures (BUG-041)",changes:["Fixed: when FileSystemEntry resolution failed during a drag-drop upload, the drop did nothing \u2014 no upload, no error. WebKit hit this deterministically (its webkitGetAsEntry() returns entries whose .file() errors for synthetic DataTransfers), but the silent-failure path existed for any entry-resolution failure on any engine. Both drop handlers now share resolveDroppedFiles(), which falls back to the flat dataTransfer.files list when the entries path yields nothing (BUG-041).","Internal: the three WebKit e2e skips are removed \u2014 the WebKit lane now runs skip-free (the two drop specs pass via the fix; the presigned-download spec now asserts the app's network-level contract instead of Playwright's engine-dependent download event). Diagnosed with per-engine probes in the #47 e2e container."]},{version:"1.37.3",date:"2026-07-11",title:"Mobile: per-row file-table actions reachable (reflow)",changes:["Fixed: on phone viewports the file-table actions column ran past the right edge, so the per-row buttons (properties, rename, download, copy link, move, delete) were unreachable \u2014 only batch selection + the toolbar worked on mobile (#49, slice 2 of the mobile-responsive work). At \u2264640px the two Modified date columns are now hidden and the action buttons wrap onto additional lines inside the row, with slightly larger tap targets, so every per-row action is reachable. The copy-link/share popover \u2014 wider than a phone screen \u2014 now opens as a lower-viewport sheet on mobile instead of an anchored popover.","Desktop layout is unchanged (all rules live in the mobile media query; the buttons gained an inline wrapper that does not affect desktop rendering).","Internal: new mobile e2e (issue-49-mobile-actions) asserts no horizontal overflow, that every per-row button's bounding box sits inside the viewport, and exercises per-row delete plus the copy-link sheet on a Pixel 5 profile without force-clicks (force-clicks are how the earlier matrix stayed green while the buttons were off-screen)."]},{version:"1.37.2",date:"2026-07-11",title:"Mobile: responsive shell (header wraps, modals fit)",changes:["Fixed: on narrow (phone) viewports the header controls ran off the right edge \u2014 Disconnect, Copy link, and Find duplicates were unreachable \u2014 and the resulting page overflow displaced the centered modals so their action buttons (Delete, Move here) could not be tapped. In practice a mobile user could not disconnect, delete, or move. The header now wraps its controls onto additional rows, and modals are sized to the viewport (scrolling if tall), so everything is reachable on mobile.","Internal: the app's first responsive breakpoint (@media (max-width: 640px)); the mobile e2e matrix (Pixel 5 / iPhone 13) now passes. The file-table actions-column reflow on mobile is a follow-up."]},{version:"1.37.1",date:"2026-07-11",title:"Fix: PDF preview blank in Firefox",changes:[`Fixed: previewing a PDF rendered blank in Firefox \u2014 a regression since v1.11.1. The preview iframe used sandbox="", which disables scripts, and Firefox renders PDFs with its script-based pdf.js viewer, so nothing showed (Chromium uses a native viewer and was unaffected, which is why it slipped through). The iframe now uses sandbox="allow-scripts", which lets pdf.js run while still blocking same-origin access, forms, top-navigation, popups, and plugins; the preview is served as application/pdf and the frame has no allow-same-origin, so it cannot execute as HTML or reach the app's origin. Closes #46.`,"Internal (testing): cross-engine e2e groundwork \u2014 an engine/device selector in the e2e harness (E2E_ENGINE/E2E_DEVICE) and a PDF-preview e2e that runs under Firefox as well as Chromium."]},{version:"1.37.0",date:"2026-07-11",title:"Folder rename",changes:['New: rename a folder in place \u2014 a \u270E affordance on folder rows opens an inline editor (like file rename). Because a folder can hold many objects, the rename runs as a cancelable "Rename" task in the operations panel (per-object copy-then-delete through the move pipeline) rather than blocking the row.',"Safe by default: the rename is blocked if a folder with the new name already exists at the same parent \u2014 inline if the sibling is visible, and authoritatively by the engine (which refuses and copies nothing if the target prefix is occupied). No merging.","Hardening: object-name validation (shared by rename and folder creation) now rejects a name that is exactly . or ... Names that merely contain .. (e.g. report..final.pdf) stay valid.","Closes #18."]},{version:"1.36.1",date:"2026-07-11",title:"Resilient bucket listing (transient-error retry)",changes:['Fixed (reliability): bucket listing \u2014 the initial load and "Load more" pagination \u2014 now retries transient throttling (SlowDown/503/429) and network blips with backoff+jitter, the same treatment upload, move, and delete already had. Listing was the one S3 read issued with no retry, so a momentary blip surfaced as an opaque connect or "Load more" failure (#23).',"Internal: extracted src/lib/list-objects.js (listObjectsPage) \u2014 the retry-wrapped single-page fetch \u2014 out of Browser.jsx."]},{version:"1.36.0",date:"2026-07-10",title:"Copy link: include access key ID",changes:["New: the header Copy link button is now a small menu with two share-link variants:","Connection only (no credentials) \u2014 the existing link (endpoint, bucket, provider, region); safe to share publicly.","Include access key ID \u2014 also embeds the access key ID, so a recipient only needs to enter the secret key to connect. The secret key is never included in either link.",'New (recipient): opening an "include access key ID" link pre-fills everything except the secret key, auto-focuses the Secret Key field, and adapts the pre-fill banner to prompt for only the secret key.',"Security: all share params remain in the URL hash fragment (never sent to servers); the key ID param is validated on read (no whitespace, \u2264 128 chars)."]},{version:"1.35.0",date:"2026-07-08",title:"Master queue: unified operations panel with cancellation",changes:["New: a unified operations panel replaces the separate delete and move panels \u2014 one row per operation with progress, expandable per-item error details, and controls.",'New: delete, move, and copy operations can now be cancelled mid-run. Cancellation is cooperative: work already in flight completes (Cancel stops at the next batch), and the row reports exactly how much was done, e.g. "Cancelled \u2014 deleted 3,000 of 18,400".','New: "Dismiss all finished" bulk action once two or more operations have settled.',"Changed: finished operation rows now persist until dismissed instead of disappearing after 3 seconds \u2014 a delete result is evidence, not a fleeting notification. Success toasts are unchanged.","Fixed (hardening): a cancelled folder delete/move can no longer report the folder as fully completed \u2014 completion now requires every object confirmed deleted/moved, not merely the absence of errors.","Internal: new module-level task store with animation-frame-batched progress updates (delete/move progress no longer re-renders per object); delete confirmation extracted to a pre-queue modal; the duplicated delete/move panel CSS and JSX were consolidated."]},{version:"1.34.0",date:"2026-07-01",title:"Multi-origin sharding: add Wasabi",changes:["Wasabi now supports parallel upload connections (on by default), joining Backblaze B2 and AWS S3. Verified Wasabi is HTTP/1.1 across regions (s3.<region>.wasabisys.com) with *.s3.<region>.wasabisys.com cert coverage. It reuses the default-origin-aware model \u2014 Wasabi defaults to virtual-hosted addressing, so the added second origin is path-style, probed on part 1 with graceful fallback to single-origin.","Provider support is now: B2, AWS, Wasabi (all HTTP/1.1). Still excluded: Cloudflare R2 (HTTP/2 \u2014 no benefit) and MinIO/generic (virtual-hosting is deployment-specific)."]},{version:"1.33.0",date:"2026-07-01",title:"Multi-origin sharding extended to AWS S3",changes:['AWS S3 now supports parallel upload connections (Settings \u2192 "Parallel upload connections", on by default), joining Backblaze B2. Verified AWS is HTTP/1.1 with *.s3.<region>.amazonaws.com cert coverage, so a bucket is reachable via two distinct origins \u2014 path-style (s3.<region>.\u2026/bucket) and virtual-hosted (bucket.s3.<region>.\u2026) \u2014 for two ~6-connection pools.',"Sharding is now default-origin aware. Each provider has a guaranteed default addressing style (path-style for B2, virtual-hosted for AWS); the second origin uses the opposite style, and part 1 probes that added origin, silently falling back to the default if it's rejected. So on any provider the worst case is single-origin (unchanged behaviour), never a failure. This also fixes a latent issue where AWS would have placed both lanes on the same virtual-hosted origin (no speedup), since the connected client already uses virtual-hosting for AWS.","Still excluded: HTTP/2 providers (Cloudflare R2), where sharding gives no benefit, and MinIO/generic, where virtual-hosting is deployment-specific."]},{version:"1.32.0",date:"2026-07-01",title:"Upload history: richer diagnostics + expandable per-row detail",changes:["The upload history now records full per-upload diagnostics \u2014 part size, part count, transient retry count, provider, endpoint, and bucket \u2014 on top of the existing mode / concurrency / sharding / speed. The IndexedDB log store is schema-flexible, so older entries are unaffected (absent fields are simply omitted).",'Compact default line, expand for the rest. The Strategy column stays a concise one-liner \u2014 e.g. manual \xB7 32 MiB \xB7 32 conns \xB7 sharded \xD72 (now disambiguating part size from concurrency, which the old "N parts" conflated) \u2014 and clicking any row reveals a full diagnostic breakdown: part size, part count, peak concurrency, transient retries, avg speed, duration, provider/bucket/endpoint, probe result, and the error message for failed uploads. Useful for problem-solving without cluttering the everyday view.',"withUploadRetry gained an onRetry hook so the transient-retry count \u2014 a flaky-network signal \u2014 is captured for the log."]},{version:"1.31.0",date:"2026-06-30",title:"Multi-origin sharding on by default (B2) with graceful fallback; fix BUG-035",changes:[`On by default for Backblaze B2 (Settings \u2192 "Parallel upload connections", still toggleable). Splits each large file's parts across two origins \u2014 path-style (s3.<region>.\u2026/bucket) and virtual-hosted (bucket.s3.<region>.\u2026) \u2014 for two ~6-connection pools, roughly doubling per-file throughput toward link speed with no browser configuration required.`,"Probe-based graceful fallback: each sharded upload probes the virtual-hosted origin with part 1; if the provider rejects it, the file silently continues single-origin. Sharding can only help, never fail.",`Gated to DNS-safe bucket names; the upload log's strategy column now shows "sharded \xD72" when it engaged. (The resume path remains single-origin for now.) ### Fixes`,"BUG-035: a non-probe multipart upload (manual mode, small multipart, or sharded) threw ReferenceError: probeResolved is not defined at completion \u2014 the object uploaded but the item showed as failed. Introduced by the BUG-033 refactor in v1.29.0; restored the variable to function scope. The browser e2e suite is the only layer that exercises this path, so the pre-push hook now runs the component and e2e suites (not just unit tests) \u2014 an upload-completion regression can no longer ship.",'Fixed a stale browser-e2e selector (the filter-box placeholder gained a "( / )" shortcut hint); the browser e2e suite is green again.']},{version:"1.30.0",date:"2026-06-30",title:"Upload reliability: transient-error retry + resume-on-failure; experimental multi-origin sharding",changes:['A transient network error no longer fails an entire large upload. Every UploadPart and the final CompleteMultipartUpload now retry on transient fetch/connection errors (Firefox "NetworkError when attempting to fetch resource.", Chromium "Failed to fetch", timeouts, connection resets) with exponential backoff + jitter \u2014 abort-aware, in both the fresh and resume paths. Previously a single blip on any of thousands of parts (or on the one completion call) killed the whole upload, because the AWS SDK does not classify a bare fetch TypeError as retryable.',"Failed uploads can now Resume, not just Restart. A multipart upload that fails on a transient (non-permission) error keeps its server-side session and uploaded parts; the failed item now offers Resume (uploads only the missing parts) alongside Restart (re-uploads from zero). Recovering a near-complete 235 GiB upload becomes seconds instead of a full re-transfer. ### Experimental",`Multi-origin upload sharding (Settings \u2192 "Parallel upload connections", B2 only, default off). Splits a large file's parts across two origins \u2014 path-style (s3.<region>.\u2026/bucket) and virtual-hosted (bucket.s3.<region>.\u2026) \u2014 so the browser opens two ~6-connection pools instead of one, roughly doubling per-file concurrency toward link speed. B2's cert and routing accept both addressing styles; this path is not yet validated end-to-end against a live signed upload \u2014 enable for testing only. Gated to DNS-safe bucket names; silently stays single-origin otherwise.`,"createS3Client gains an optional { forcePathStyle } override, used to build the virtual-hosted client for sharding."]},{version:"1.29.0",date:"2026-06-30",title:"Fix: large part sizes collapsed upload concurrency to 1; configurable memory budget",changes:["BUG-033: a large part size silently forced fully sequential uploads. Part concurrency is bounded by a memory budget (concurrency \xD7 partSize must fit within it), and that budget defaulted to 200 MiB. With a user-chosen 128 MiB part size, floor(200 MiB / 128 MiB) = 1 clamped concurrency to a single stream regardless of the configured value \u2014 so a 20 GB file uploaded one part at a time, and choosing a *larger* part size made it slower, not faster. The default budget is now 1 GiB, which keeps large parts parallel (128 MiB parts \u2192 8 concurrent). Ordinary 5 MiB uploads are unaffected (peak ~80 MiB either way). The fix applies to both fresh and resumed multipart uploads.",'New "Upload memory budget (MiB)" setting (range 64\u20138192, default 1024) exposes the ceiling on total RAM held by in-flight upload parts, making the part-size / concurrency / memory tradeoff tunable instead of a silent cap. Settings \u2192 Upload memory budget.',"Tests: a regression assertion in concurrency-strategy.test.js (fails at the old 200 MiB default, passes at 1 GiB), a storage.test.js accessor round-trip, and a settings-panel.test.jsx field render."]},{version:"1.28.0",date:"2026-06-30",title:"Upload throughput: drop the redundant per-part CRC32",changes:["requestChecksumCalculation: 'WHEN_REQUIRED' set on the S3 client (src/lib/s3-client.js). Since AWS SDK for JavaScript v3.729.0 the flexible-checksums middleware defaults to WHEN_SUPPORTED, which attaches an automatic CRC32 checksum to every PutObject and UploadPart. Bucketer never requests an upload checksum, so that CRC32 was pure overhead \u2014 a second full traversal of each part's bytes on the main thread, on top of the SigV4 x-amz-content-sha256 SHA-256 \u2014 and the unsolicited x-amz-checksum-crc32 header has been rejected by some S3-compatible providers (Cloudflare R2, Backblaze B2). WHEN_REQUIRED keeps checksums only for operations that mandate them; multipart object integrity remains ETag-based. Backward-compatible.","Test (test/s3-client.test.js): asserts the client resolves requestChecksumCalculation to WHEN_REQUIRED."]},{version:"1.27.0",date:"2026-06-21",title:"Privacy: Referrer-Policy `no-referrer`",changes:['<meta name="referrer" content="no-referrer"> added to the document head. Presigned S3 URLs and bucket/prefix names \u2014 which live in the URL and hash fragment \u2014 no longer leak via the Referer header on any outbound navigation, including the sandboxed PDF preview iframe. Static hosting (S3/R2/B2) cannot set a Referrer-Policy response header, so the meta tag delivers the guarantee with no server configuration. Placed immediately after the app-version tag so the update-check byte-512 invariant is unaffected (build-id and app-version still end at bytes 179/224).',"Build invariant added to build.test.js: asserts the tag is present and set to no-referrer."]},{version:"1.26.3",date:"2026-06-20",title:"Fix: drag-dropped uploads landed at root; sub-folder not shown until reload",changes:['Drag-dropped uploads now target the current folder, not the bucket root (#2, BUG-031). UploadQueue exposed addFiles once via onMount ([] deps), so the reference the drag-drop handlers call captured a stale closure over the mount-time destination prefix (root). Every dragged file/folder uploaded to the root regardless of the folder being viewed; the "Choose files" picker (which used a fresh closure) worked. Fixed by reading the destination through a live ref (destinationPrefixRef) \u2014 the same pattern Browser.jsx already uses for its onMount-exposed actions.',"A sub-folder created by an upload into the current view now appears without a manual reload (#4, BUG-032). onUploadsDrained refetched the listing only on an exact prefix match, so uploading a folder *into* the current view (which drains the new sub-prefix, not the current prefix) left the new folder invisible until reload. It now refetches when any drained prefix is the current prefix or a descendant of it.",'Refresh control is now labelled "\u21BA Refresh" (was an unlabelled \u21BA icon) and its tooltip notes it pulls changes uploaded from other devices \u2014 Bucketer is backendless, so cross-client changes (#4, part 1) surface on demand via Refresh rather than live.',"e2e regression coverage for all of the above, plus an Android-emulated check that uploading into a nested folder does not teleport the view to root (the desktop BUG-029 fix holds under mobile emulation; the reporter's residual mobile teleport (#3) needs native-device repro details)."]},{version:"1.26.2",date:"2026-06-20",title:"Fix: file checkboxes were unclickable (BUG-030) + P1 e2e coverage",changes:["Node: presigned GET full + Range (206) + content-disposition override.","Browser: multi-select batch delete & batch move, select-all, filter, sort, copy-link popover; the full properties metadata matrix (Content-Type/Size/ETag/File Modified/content-hash); the versioning journey (delete \u2192 marker \u2192 undelete from Hidden Versions); the credential-screen regressions BUG-018 (save-as-profile enablement), BUG-020 (save pre-connect), BUG-027 (post-disconnect form), BUG-026 (region re-inference after profile load); and BUG-009 (a 403 on UploadPart aborts the multipart session, leaving no orphan).","Mock server: batch DeleteObjects now creates delete markers on a versioned bucket; e2e files run serially (--test-concurrency=1) to avoid browser-contention flakes."]},{version:"1.26.1",date:"2026-06-20",title:"End-to-end test coverage on the stateful mock S3 server",changes:["Mock server extensions (test/e2e/mock-s3/server.mjs): ListParts pagination (the BUG-007 substrate), fault hooks on the multipart/copy/get paths, presigned response-header overrides (response-content-disposition), a request-level vs per-key delete fault distinction, and a CORS fix so a narrowed ExposeHeaders genuinely hides x-amz-meta-* from the browser (the BUG-028 substrate).","Node-integration layer (test/e2e/node/): the destructive failure modes asserted against real bucket state \u2014 delete-denied-after-copy duplicate, multipart-copy abort-on-failure, partial batch delete, transient-throttle recovery, the dedup byte-for-byte gate over real GetObject streams, and a >1000-part ListParts resume (BUG-007).","Browser layer (test/e2e/browser/): real-browser proofs that unit tests can't give \u2014 BUG-028 (metadata hidden vs visible by CORS ExposeHeaders) and BUG-012 (an HTTP-DELETE operation blocked when DELETE is absent from CORS), batch upload, stay-in-folder after upload (BUG-029), move via the picker and via HTML5 drag-and-drop, presigned download, and capability-denied handling.","Source data-testid hooks (inert): app-connected, file-row:<name>, folder-row:<name>, properties-modal, meta-file-modified, delete-confirm.","Scripts/CI: npm run test:e2e (+ :node/:browser); a non-blocking GitLab e2e job. The e2e build targets the gitignored perf/ directory so the committed dist/index.html stays pristine."]},{version:"1.26.0",date:"2026-06-19",title:"Drag-and-drop moving",changes:["Drop targets you can already see \u2014 folder rows in the listing (move *into* a subfolder) and breadcrumb crumbs for the current folder's parent and any ancestor up to root (move *up*). A target highlights only while it is a valid destination; dropping a folder into itself/a descendant, or onto its current location, is rejected with a no-drop cursor.","Selection-aware \u2014 dragging a row that is part of the current selection moves the whole selection; dragging an unselected row moves just that row, leaving any selection intact.",`Internal vs. external drags \u2014 object moves are distinguished from OS file drags by the Files DataTransfer type, so dragging an object no longer raises the "Drop files to upload" overlay (handleTableDragEnter and the table's onDragOver now gate on it).`,"Pure decision logic in new src/lib/move-drag.js (dragPayload, dropAccepted) \u2014 unit-tested in isolation since DragEvent/DataTransfer don't exist under the test runner; the Browser/Breadcrumb wiring is a thin shell over it. Breadcrumb.jsx gained opt-in move-drop props (the picker's use is unchanged)."]},{version:"1.25.0",date:"2026-06-19",title:"Move files & folders into another folder",changes:[`Folder-tree destination picker (src/components/MovePickerModal.jsx) \u2014 drill into prefixes (ListObjectsV2 with Delimiter:'/') and click Move here. The picker is the confirmation step; a structural guard (src/lib/move-guards.js) disables "Move here" with an inline reason for invalid destinations (a folder into itself or a descendant, or a no-op move).`,"Copy-before-delete, per object (src/lib/move-queue.js, runMoveOperation) \u2014 each object's source is deleted only after its copy is confirmed, so an object is always in a clean state (source-only / both / destination-only). Source rows are removed incrementally as they complete; a worker pool (8) with throttling backoff (src/lib/s3-retry.js) handles large folder moves.","Any size, from day one \u2014 objects \u2264 5 GiB use a single CopyObject (MetadataDirective:'COPY'); objects > 5 GiB use multipart UploadPartCopy (src/lib/move-multipart.js), carrying Content-Type and custom metadata forward via a source HeadObject (UploadPartCopy copies bytes only) and aborting any orphaned multipart session on failure. New constant COPY_MULTIPART_THRESHOLD (5 GiB), distinct from the 5 MiB upload MULTIPART_THRESHOLD.","Never overwrites \u2014 a single destination-prefix scan pre-detects collisions (and intra-batch duplicate target keys); a colliding object is skipped with both source and destination left untouched. Skips are surfaced in the move panel (src/components/MoveQueue.jsx) distinctly from genuine failures. If a copy succeeds but the source delete is denied, the object now exists in both places \u2014 this is reported as a distinct error and the source is left in place (never auto-deleted).","Cross-provider \u2014 server-side copy is permitted by the existing CORS template (PUT + x-amz-copy-source via the x-amz-* rule) on all supported providers; no CORS change is needed. Move is gated on both write (upload) and delete capabilities.","Key remapping (src/lib/move-key.js) preserves a moved folder's own name and nested sub-prefix structure under the destination, including the 0-byte folder-marker object."]},{version:"1.24.0",date:"2026-06-18",title:"Duplicate detection: durable results + scrollable report",changes:['Durable scan results \u2014 a scan is no longer discarded when the report closes. Results are persisted per (endpoint, bucket) in a new IndexedDB store (bucketer_dedup_scans; DB schema bumped v2 \u2192 v3) and restored on reopen, so a large scan never has to be repeated. Keeper choices and byte-for-byte verifications are saved as they are made (transient progress flags are stripped, so a reload never shows a stuck spinner). The report shows a "Last scan: \u2026 \xB7 N objects \xB7 timestamp \xB7 restored from cache" line with Re-scan and Clear saved controls. Persistence is best-effort: when IndexedDB is unavailable it degrades to a no-op rather than failing the scan. New module src/lib/dedup-scan-store.js.',"Scrollable, wider report \u2014 the duplicates dialog is now min(94vw, 920px) wide and height-capped at 88vh, with the match list scrolling inside the dialog instead of overflowing the viewport. Long keys/paths wrap rather than truncating.","Test infrastructure \u2014 test/helpers/with-dom.js now installs a non-recursive performance.now(). jsdom's own performance.now() recurses into itself once installed as the global performance, overflowing the stack under an async component re-render; this removes that long-standing hazard and unblocks async component tests."]},{version:"1.23.0",date:"2026-06-17",title:"Duplicate detection (iteration 1: scan + verify, read-only)",changes:["Tiered, provider-agnostic detection (src/lib/dedup-scan.js) \u2014 narrows candidates cheaply: free size grouping \u2192 one HeadObject per same-size object (deriving a trusted single-part ETag-MD5, our content-hash stamp, and the multipart/encryption flags) \u2192 an opportunistic, AWS-only GetObjectAttributes checksum adapter. The engine only ever lists and HEADs; it never mutates an object.","Byte-for-byte verification is the only deletion gate (src/lib/verify-bytes.js). No hash decides identity: MD5 and SHA-1 are broken for collision resistance and even SHA-256 is a hash, so matches are shown as candidates and a streaming byte-for-byte comparison (immune to any hash collision, low memory, early-abort) is what promotes a group to verified.","Content-hash stamp on upload \u2014 every upload now records x-amz-meta-bucketer-content-hash with a self-describing value (sha256-ht64k:<hex>, the existing head/tail sample) as a cheap candidate filter for future scans. The hash is computed once and reused for the multipart resume record. Works on every provider, including those that expose no usable server-side checksum.","Strict, fail-loud provider adapter (src/lib/provider-checksum.js) \u2014 accepts a provider checksum only in an exact full-object shape, falls back to the universal tiers otherwise, and console.warns genuinely unexpected shapes so they can be reported and the adapter refined from real data. Other providers get an adapter only once probe output confirms one.","Report UI (src/components/DuplicatesModal.jsx) \u2014 candidate/verified badges, per-group keep-selection (default: oldest copy), and read-only per-object download/preview/copy-link. Delete others and Move others render as disabled stubs in this iteration. No existing object is ever rewritten (no checksum backfill) and the CORS template is unchanged."]},{version:"1.22.4",date:"2026-06-16",title:"Fix: upload completion no longer resets browser to root (BUG-029)",changes:[]},{version:"1.22.3",date:"2026-06-14",title:"Chore: reconcile package-lock.json version",changes:[]},{version:"1.22.2",date:"2026-06-14",title:"Internal: extract ConfirmDialog from StorageModal",changes:[]},{version:"1.22.1",date:"2026-06-13",title:"Move integrity check pre-auth into the version modal",changes:[]},{version:"1.22.0",date:"2026-06-13",title:"Build integrity check (honest-host)",changes:["Honest framing \u2014 the match/mismatch UI explicitly states that this proves the host is serving the canonical artifact, not that the running JavaScript was not modified. A malicious host could rewrite both.","Build pipeline \u2014 build.mjs now emits dist/integrity.json alongside dist/index.html (sha256 in an extensible hashes object \u2014 sha512/blake3 can be added later without a schema migration).","Release pipeline \u2014 scripts/release.mjs uploads the manifest to the same GitLab Generic Package Registry path as the HTML and lists it among the Release assets.","CI reproducibility guard \u2014 .gitlab-ci.yml gains a reproducibility stage that builds twice and diffs both index.html and integrity.json. The release job now depends on this stage. Catches any future regression that leaks nondeterminism into the build.","Result states \u2014 match (green), mismatch (red with both hashes), no-manifest (yellow, for versions predating this feature), unknown-algorithm (yellow), network error (yellow).","Default off \u2014 enabling the toggle is the only thing that triggers any network call to GitLab."]},{version:"1.21.1",date:"2026-06-12",title:"Fix custom metadata invisible in browser (BUG-028)",changes:[]},{version:"1.21.0",date:"2026-06-12",title:"File modification time tracking",changes:[]},{version:"1.20.0",date:"2026-06-11",title:"In-page preview on download links",changes:["PreviewMedia component (src/components/PreviewMedia.jsx) \u2014 shared renderer for image, audio, video, PDF, and text kinds; replaces the equivalent inline JSX in Browser.","DownloadPage preview \u2014 detects the file type from the extension and renders the appropriate preview element using the presigned URL as the source directly. Text files are fetched in a useEffect (range-limited to 100 KB, same as the browser preview).","Browser refactor \u2014 preview rendering in Browser.jsx now delegates to PreviewMedia with no behaviour change."]},{version:"1.19.0",date:"2026-06-11",title:"Presigned URL sharing",changes:["Share via Bucketer button in the file copy-link popover (single-file only; preset durations: 1 h, 24 h, 7 d).","DownloadPage \u2014 recipients open the link in Bucketer and see a clean download card showing the file name, expiry countdown, and a Download button. No S3 credentials required.",'Expired link handling \u2014 if the presigned URL has passed its expiry, the download button is replaced with an "This link has expired" notice.',"base64url encoding \u2014 synchronous, universally supported (including Safari), no compression API required."]},{version:"1.18.0",date:"2026-06-11",title:"Adaptive upload concurrency",changes:["Adaptive/Manual toggle in Settings (adaptive is the default). In adaptive mode the part and file concurrency sliders are hidden.","Sort-by-size: files in a batch are enqueued smallest-first so small files complete quickly and part concurrency scales up sooner for large files.","Budget rebalancer: as active uploads drop, partsPerFile scales up automatically (4 files \u2192 4 parts/file, 2 files \u2192 8 parts/file, 1 file \u2192 16 parts/file), keeping total in-flight streams near 16.","Per-file probe (files \u2265 100 MB): uploads one warm-up part then times a baseline and candidate (+4) concurrency phase; holds the faster result for the rest of the file. Inconclusive probes (measurement < 10 ms) fall back to baseline.","Memory cap: part concurrency is clamped so total ArrayBuffer usage across all concurrent files stays within 200 MiB, preventing tab crashes on very large files where calcPartSize raises the part size beyond 5 MiB.","Strategy column in Upload history showing mode, peak part concurrency, and probe outcome per file.","Console debug output via localStorage.setItem('s3b_debug_concurrency', '1'): logs rebalance events (only when partsPerFile changes) and per-file file-complete summaries with speed and probe results.","New pure module src/lib/concurrency-strategy.js (calcAdaptiveConcurrency, createProbeState, resolveProbe, capConcurrencyByMemory) \u2014 fully unit-tested."]},{version:"1.17.0",date:"2026-06-08",title:"Component decomposition: extract sub-components from UploadQueue and Browser",changes:["BatchSummary.jsx, UploadItem.jsx, ErrorDetailsPanel.jsx \u2014 from UploadQueue.jsx (1053L \u2192 697L)","CopyLinkPopover.jsx, Breadcrumb.jsx, SortTh.jsx \u2014 from Browser.jsx (1130L \u2192 1015L) All 585 unit tests + 233 component tests pass. Test imports updated to reference the new files directly."]},{version:"1.16.0",date:"2026-06-08",title:"Code simplification: shared utilities, deduplication, indexeddb split",changes:["lib/constants.js: centralises MULTIPART_THRESHOLD, LARGE_FILE_WARN, PRESIGN_EXPIRES, TEXT_PREVIEW_LIMIT, COPY_LINK_PRESETS, and concurrency defaults previously scattered across UploadQueue.jsx and Browser.jsx. One place to change a threshold.","lib/upload-status.js: isActive / isFailed / isSettled / isPaused / isDone / isAborted predicate functions, replacing inline i.status === 'uploading' || i.status === 'resuming' || ... chains duplicated 4+ times in UploadQueue.jsx.","lib/upload-cleanup.js: abortMultipartSession(client, params) \u2014 abort + deleteResumeRecord were copy-pasted in three best-effort cleanup paths; now a single tested helper with a doc comment explaining which callers must stay inline (those that surface errors to the UI).","lib/sort.js: nameComparator / numericComparator factories extracted from Browser.jsx. Locale-comparison options (sensitivity: 'base') defined in one place.","lib/validate-object-name.js: shared validation (non-empty, no slashes) for both rename and folder-create; rules cannot silently diverge between the two callers.","lib/purge-versions.js: purgeAllVersions() and collectHiddenVersions() extracted from HiddenVersions.jsx. The 57-line async pagination + batched DeleteObjectsCommand loop is now independently testable with a mock S3 client (6 new tests).","lib/indexeddb.js \u2192 barrel over four focused modules: indexeddb-core.js (shared openDB, schema constants), resume-records.js, file-identity.js, active-uploads.js, upload-log.js. Each module owns one concern; the barrel preserves all existing import paths.","lib/storage.js factory refactor: 8 near-identical load<Setting> / save<Setting> function pairs collapsed into a makeSettingAccessors() factory. All exported function names are identical \u2014 callers are unchanged.",`hooks/useDoubleClickSafety.js: the "prime for 3 s, confirm on second click" timer pattern was duplicated between the main UploadQueue cancel-all button and BatchSummary's per-batch cancel button. Extracted as a hook + pure applyClickSafety() function (tested with injected timer stubs).`,"hooks/useInterpolatedProgress.js: rAF byte-counter animation extracted from UploadItem. Pure interpolateBytes() function tested separately from the Preact hook.","hooks/useWindowDragDrop.js: ~60 lines of dragenter / dragleave / dragover event listener setup, counter management, and the handleWindowDrop file-entry resolver extracted from App.jsx.","hooks/useModalStates.js: App-level changelog / about / storage modal open-state grouped so new modals have a canonical home. Component refactoring (Phase 2): each component is shortened using Phase 1 utilities; tests run before and after each change.","UploadQueue.jsx (\u221275 lines): uses useDoubleClickSafety, useInterpolatedProgress, status predicates, abortMultipartSession, and constants. ErrorDetailsPanel extracted as a named sub-component. MultipartFailureConsequence moved to its own file (components/MultipartFailureConsequence.jsx) since it has no dependency on UploadQueue state.","Browser.jsx (\u221271 lines): CopyLinkPopover and BatchCopyLinkPopover merged into one parameterised component \u2014 fileKey for single, fileKeys for batch. Uses nameComparator / numericComparator, validateObjectName, and constants.","App.jsx (\u221267 lines): dead statusLabel variable removed (declared but never read). Drag-drop logic extracted to useWindowDragDrop; modal open-state extracted to useModalStates.","HiddenVersions.jsx (\u221241 lines): delegates purge to purgeAllVersions(); uses collectHiddenVersions.","StorageModal.jsx: internal Confirm sub-component renamed ConfirmDialog for clarity. Tests: 76 new tests added across 8 new test files (584 total). Source-invariants updated to assert the new structure \u2014 e.g. that BatchCopyLinkPopover cannot be re-introduced as a separate function, that UploadQueue imports its hook and predicate dependencies, and that indexeddb.js is a barrel (no openDB definition)."]},{version:"1.15.6",date:"2026-06-07",title:"Credential form and profile management bug fixes",changes:['Region inference restored for loaded profiles (BUG-026): loading a saved profile silently marked the region as "user-edited" regardless of whether its stored value matched what the endpoint would give. The _initExtractedRegion IIFE bailed out early when initial.regionOverride was set, making the comparison against the extracted value impossible. Removed the early bail; now the stored region is compared to the extracted one and treated as inferred (allowing endpoint changes to update it) when they match. The "Auto-filled from endpoint URL" hint also reappears for profile-loaded regions that are endpoint-derived.',"Post-disconnect form repopulated from selected profile (BUG-027): disconnecting cleared credentials to all-empty but left selectedProfileId pointing to the last profile, leaving the splash screen with a highlighted profile row and a blank form. Clicking the row was a no-op (same key, no CredentialForm remount). handleDisconnect now repopulates credentials and liveFormData from the selected profile minus the secret key, so the user only needs to re-enter the secret key to reconnect.",'Default profile name now includes provider (Issue 3): defaultName in ProfilePicker read formData.provider, which is absent when liveFormData comes from live form edits (those carry providerOverride instead). Now resolves providerOverride || provider || detectProvider(endpoint) so the suggested name reflects what the form shows \u2014 "B2 \u2014 my-bucket" instead of just "my-bucket".','Profile delete requires confirmation (Issue 4): clicking \u2715 on a profile row previously deleted it immediately with no undo. Now shows an inline "Delete? [Confirm] [Cancel]" confirmation in the row; the Confirm button is styled in danger-red. Clicking the row itself also dismisses the confirmation without selecting the profile.']},{version:"1.15.5",date:"2026-06-07",title:"Bidirectional endpoint\u2194region inference in credential form",changes:['Region auto-filled from endpoint: the region field is now always visible and is automatically populated when the endpoint URL embeds a region (B2, Wasabi, AWS, DO Spaces). Previously the extracted region was only shown as a sidebar hint; now it appears as an editable value with an "Auto-filled from endpoint URL" indicator.',`Endpoint auto-filled from provider + region: selecting a provider from the override dropdown and typing a region constructs and auto-fills the canonical endpoint URL ("Auto-filled from provider and region"). Provider-specific exceptions are handled: Wasabi's us-east-1 produces https://s3.wasabisys.com (bare legacy hostname) rather than the na\xEFve template. R2 auto-fills the region with 'auto' (endpoint requires account ID and cannot be constructed). MinIO and Generic providers do not infer endpoints.`,"Endpoint patterns verified against official docs (all fetched 2026-06-04/07): B2 via backblaze.com/docs, Wasabi via docs.wasabi.com, AWS via docs.aws.amazon.com/general, DO Spaces via docs.digitalocean.com, R2 via developers.cloudflare.com.","Circular update prevention: a userEditedRef ensures inference only flows from user-typed fields into fields the user has not yet touched. Editing an auto-filled field marks it as user-owned and stops inference from overwriting it."]},{version:"1.15.4",date:"2026-06-06",title:"Profile reliability: provider inference, update-in-place, reload consistency, hint labels",changes:[`Provider override no longer carries over from auto-detection: CredentialForm previously initialized the provider-override dropdown from the stored/detected provider, so switching a form pre-filled with B2 credentials to a Wasabi endpoint would silently submit provider: 'b2'. The dropdown now only pre-selects a value when it genuinely differs from what detectProvider would return for the current endpoint \u2014 i.e., only for real overrides (MinIO on a generic URL, a reverse proxy, etc.). Auto-detected providers always start at "Auto-detect from endpoint".`,`Profile save updates in place: "Save current as profile\u2026" previously always created a new profile (id: Date.now()), making it impossible to update an existing one. When a profile is currently selected, the button now reads "Update profile\u2026" and saves with the existing profile's id, replacing it rather than duplicating it. The name input pre-fills with the profile's current name.`,"Reload prefers flat credentials over profile data: on page load, the app previously always loaded the last-selected profile's data, which overwrote credentials saved by a manually-entered connection that was never saved as a profile. Flat credentials (written on every handleConnect) are now used when present; the profile is used only as a fallback when flat credentials are absent (i.e. after a disconnect or first load).",'Profile list hint shows full provider names: the hint line under each profile name now uses PROVIDER_LABELS ("Backblaze B2 \xB7 bucket") instead of the raw key uppercased ("B2 \xB7 bucket").']},{version:"1.15.3",date:"2026-06-06",title:"Upload UI cleanup: hide when denied, drop zone removed, empty-state hint",changes:["Upload UI hidden when denied: entire upload section (destination folder, file/folder picker buttons) is now hidden when capabilities.upload === 'denied' rather than shown in a disabled/greyed state. When unknown or permitted, everything shows as before.",'Dedicated drop zone removed: the "Drop files or folders here" element in UploadQueue is gone. The window-wide overlay (v1.15.2) covers the same surface area; the zone was redundant. handleDrop and dragOver state removed from UploadQueue.','Empty-state hint: when the queue is empty and upload is available, a line reads "Drag files or folders anywhere in this window to upload, or use the buttons above." \u2014 the first-use teaching moment.',"Window overlay respects upload capability: the document dragenter listener and the overlay render are both gated on capabilities.upload !== 'denied'.","Error handling on detached drops: .catch(() => {}) added to the collectFileEntries().then() chains in handleWindowDrop (App.jsx) and handleTableDrop (Browser.jsx) to prevent silent promise rejections."]},{version:"1.15.2",date:"2026-06-05",title:"Window-wide drag-and-drop overlay",changes:["Drop anywhere on the window to upload: document-level dragenter/dragleave/dragover listeners in App.jsx activate a full-screen fixed overlay (z-index 500, below modals at 1000) whenever files are dragged over the viewport while connected.","Modal suppression: dragenter checks document.querySelector('.modal-overlay') \u2014 the overlay is not activated while any modal is open.","Overlay captures the drop: ondrop on the overlay fires collectFileEntries as a detached .then(), routing files to the same addFilesRef destination as all other drop paths.","Existing zone-specific handlers unchanged: Browser table drop and UploadQueue upload-zone drop continue to work as before; the window overlay is the primary path when connected."]},{version:"1.15.1",date:"2026-06-05",title:"Synchronous drop capture, parallel folder traversal, pending-drop indicator",changes:["Drop handlers are now synchronous (handleTableDrop in Browser.jsx, handleDrop in UploadQueue.jsx): FileSystemEntry objects are captured synchronously before any await, then collectFileEntries fires as a detached .then(). The handler returns immediately so rapid consecutive drops are captured right away rather than waiting for the previous traversal to complete.","Parallel top-level traversal in collectFileEntries: changed for\u2026await over root entries to Promise.all, so independent folder subtrees are walked concurrently rather than one at a time.",'Pending-drop indicator in UploadQueue: while folder traversal is running a pendingDrops counter drives a "Counting files in N folders\u2026" message beneath the drop zone, giving the user immediate feedback that the drop was accepted.']},{version:"1.15.0",date:"2026-06-05",title:"Refactor + accessibility: usePreview hook, cancellation guard, htmlFor labels, progress ARIA",changes:["T4-1 Extract all preview state, handlePreview, and closePreview into src/lib/usePreview.js; Browser.jsx now consumes the hook","T4-2 Add gen-ref cancellation guard to handlePreview \u2014 every await is followed by if (gen !== genRef.current) return to drop stale async callbacks when the user opens a new preview","T4-6 Add htmlFor + id to all standalone <label> elements in CredentialForm.jsx (6) and SettingsPanel.jsx (7) \u2014 screen readers and click-to-focus now work correctly",'T5-9 Add role="progressbar" + aria-valuenow/min/max + aria-label to progress bar elements in UploadQueue.jsx \u2014 upload progress is now exposed to the accessibility tree']},{version:"1.14.4",date:"2026-06-04",title:"Quality batch: concurrency cap, format guards, build invariants, provider accuracy, UI polish",changes:["T4-3 Cap discoverPrefixKeys concurrency at 8 with worker-pool; removes bare Promise.all(prefixes.map) that could throttle on large folder-delete operations","T4-4 Guard formatBytes against null/undefined/NaN/negative/Infinity \u2014 all return '\u2014' instead of crashing",'T4-5 Remove stale "No delete, rename, copy" and "N=2 concurrency" claims from docs/QUESTIONS.md',"T5-1 Add build test: production bundle must have no source map comments (regression guard)","T5-2 Add build invariant: dist/index.html must not exceed 600 KB ceiling","T5-3 Export shellQuote from cors-config.js; use in corsCmd() to prevent shell injection from bucket/endpoint names",'T5-4 Add <meta http-equiv="Content-Security-Policy"> to src/index.html for S3/R2/B2 static-hosting deployments',"T5-5 Replace module-level let _sessionFirstMount in Browser.jsx with isFirstMount prop derived from browserKey === 0 in App.jsx",'T5-6 Distinguish empty-bucket copy ("This bucket is empty. Upload files to get started.") from empty-prefix copy',"T5-7 Show filename in delete confirmation modal for single-file deletes","T5-8 Add inline hint to CapabilityPanel explaining permissions are detected automatically","T5-11 Add dotted-bucket SSL caveat to Wasabi SetupGuide step","T5-12 Correct requiresPathStyle comment \u2014 B2 supports both styles; we use path-style because users supply a plain endpoint","T5-13 Correct defaultMaxKeys comment \u2014 B2 Class C is not billed per call; 200 is a UX latency choice","T5-14 Map Wasabi legacy alias region slugs (nl-1\u2192eu-central-1, de-1\u2192eu-central-2, uk-1\u2192eu-west-1, fr-1\u2192eu-west-2, uk-2\u2192eu-west-3, it-1\u2192eu-south-1) to canonical SigV4 names to prevent signing failures"]},{version:"1.14.3",date:"2026-06-04",title:"Provider-specific fixes: Wasabi billing warnings, R2 versioning gate, AWS region patterns, SetupGuide improvements",changes:["T3-1: Delete confirmation dialogs now show a Wasabi-specific 90-day minimum retention warning when provider === 'wasabi' \u2014 both DeleteQueue (file/folder delete) and HiddenVersions purge-all confirmation. Prevents silent billing surprises for deleted test data.",'T3-2: HiddenVersions now accepts a provider prop (threaded from Browser). Cloudflare R2 buckets render a "versioning not supported" message instead of a confusing empty panel, because R2 does not implement ListObjectVersions.',"T3-3: extractRegion() for AWS S3 now handles virtual-hosted bucket URLs (bucket.s3.region.amazonaws.com), dualstack endpoints (s3.dualstack.region.amazonaws.com), FIPS endpoints (s3-fips.region.amazonaws.com), and legacy dash-style endpoints (s3-region.amazonaws.com). Pasting a URL from the AWS Console no longer silently falls back to us-east-1.","T3-4: GuideMinIO in SetupGuide now includes an explicit mixed-content warning: browsers block HTTP requests from an HTTPS-served Bucketer to an HTTP MinIO server, and the error only appears in DevTools.","T3-5: GuideB2 now mentions that application keys must have the listAllBucketNames capability \u2014 a single-bucket key without it causes AWS SDK v3 initialisation to fail entirely.","T3-6: GuideR2 now tells users where to find their Account ID (dashboard sidebar), that a payment method is required even on the free tier, and the difference between account-scoped and bucket-scoped token scope."]},{version:"1.14.2",date:"2026-06-04",title:"Correctness and security fixes: settings preservation, resume parallelism, purge-all error recovery, endpoint URL guard, CSP docs",changes:["T2-1: clearCredentials() now only removes credential fields (endpoint, bucket, keyId, provider, regionOverride). Settings keys (partSize, concurrency, etc.) survive disconnect \u2014 split LS_KEYS into CREDENTIAL_KEYS and SETTINGS_KEYS; resetSettings() now uses the canonical SETTINGS_KEYS set.","T2-2: Multipart resume path now uses the same uploadPartsWithPool worker pool as fresh uploads, matching the configured PART_CONCURRENCY. Extracted helper exported from src/lib/upload-queue.js with unit tests asserting concurrency.","T2-3: HiddenVersions.handlePurgeAllConfirm now continues through all batches on S3 Errors entries instead of throwing on the first \u2014 reports aggregate failure count in the dialog rather than abandoning remaining batches silently.","T2-4: readUrlParams() now validates the endpoint parameter (must be a parseable http: or https: URL) and the bucket parameter (no slashes or .. traversal sequences). Prevents crafted share links from pre-filling the credential form with attacker-controlled values.","T2-5: Fixed README.md nginx and Caddy CSP examples to include img-src data: https:; media-src https:; frame-src https:;. Previous img-src data: only directive silently blocked all presigned S3 preview URLs. Added note about unsafe-inline being structurally required and a future hash-based alternative.","T2-6: handleDeleteConfirm in App.jsx now wraps runDeleteOperation in try/catch. An uncaught throw previously left the delete panel stuck in discovering or deleting phase indefinitely with no dismiss path."]},{version:"1.14.1",date:"2026-06-04",title:"Fix rename: add missing DeleteObjectCommand import; add Command import invariant",changes:["Bug fix (T1-1): Browser.jsx was missing DeleteObjectCommand from its @aws-sdk/client-s3 import. Every rename threw ReferenceError after the copy step succeeded, leaving a duplicate file. Lost during the v1.14.0 unified-delete refactor.","Test invariant (T1-2): Added source-level assertion to test/source-invariants.test.js that scans every src/ file importing from @aws-sdk/client-s3 and asserts every new XCommand() usage has a matching named import. Prevents this class of bug from silently shipping again."]},{version:"1.14.0",date:"2026-06-03",title:"Unified delete, preview prefetch, collapsible upload queue, global queue actions",changes:[{group:"Unified delete workflow",items:["Replaced three separate delete code paths (single-file, multi-file, multi-folder) with a single unified flow","All delete requests \u2014 one file, many files, one folder, many folders, or any mix \u2014 go through the same confirm \u2192 discover \u2192 delete \u2192 done pipeline","Folder checkboxes added to the file listing; select-all now covers both files and folders",'Batch bar counts files and folders separately ("X files, Y folders selected")',"Non-blocking execution: the confirm modal starts the operation then dismisses; progress appears in a panel in App.jsx that survives folder navigation (same pattern as UploadQueue)","Each delete operation shows spinner during discover/delete phases, \u2713 on clean completion (auto-dismisses after 3 s), \u2715 with expandable error detail on failure","Delete batches run at CONCURRENCY=8 (up from 3) with exponential-backoff retry on 503/429/SlowDown throttling responses",'Fixed: selection bar ("X files, Y folders selected") now clears as items are removed from the listing after a successful delete',"src/lib/delete-queue.js \u2014 new execution module","src/components/DeleteQueue.jsx \u2014 new UI component: confirm modal overlay + collapsible progress entries"]},{group:"Preview signed-URL cache",items:["Signed URLs for previewed items are cached for 55 minutes (5-minute buffer before the 1-hour expiry); re-opening the same file within that window skips the HeadObject and URL-signing round-trip entirely and lets the browser serve the image from its own HTTP cache","Cache is cleared on folder navigation to prevent unbounded growth"]},{group:"Preview prefetch",items:["After the current preview item loads, the next and previous items are prefetched in the background so navigation feels instant",'Level 1 (all previewable types): HeadObject + signed URL generated and cached \u2014 eliminates the "thinking" delay on navigation',"Level 2 (images and text): image content downloaded via a hidden Image element if within the configured size limit; text fetched via the existing range request and stored in the cache so navigation requires zero network activity","Audio, video, and PDF: Level 1 only \u2014 URL cached, no content download",'New setting "Preview prefetch" in Settings: Off / 1 MB / 5 MB (default) / 10 MB / 25 MB \u2014 takes effect immediately without a page reload']},{group:"Small image preview",items:["Images smaller than 128\xD7128 px now fill the preview container (object-fit: contain at 100% width/height) so they are no longer uselessly tiny","Images detected as pixel art (natural size < 128\xD7128) get image-rendering: pixelated so they scale up crisply without blurring"]},{group:"Collapsible upload queue",items:["Each batch of dropped/selected files is now a collapsible row in the upload panel, independent of other batches",'Batches with few files start expanded; larger batches start collapsed \u2014 configurable via new "Upload queue expand threshold" setting in Settings (default: 5)',"Collapsed view shows a one-liner summary (file count, progress, speed, ETA)","Batches auto-collapse 3 seconds after all files complete","A Dismiss button appears once a batch is fully settled (no active or queued items); removes it from the panel","Cancel button is now per-batch rather than clearing the entire queue",'Desktop notifications changed from per-file to one summary notification per batch when it settles ("3 files uploaded", "2 uploaded \xB7 1 failed", etc.)']},{group:"Global queue actions bar",items:["A compact action bar appears above the batch list when multiple batches are present or when actions span batches",'"Dismiss all done" \u2014 removes all settled batches in one click (shown when 2+ batches are fully settled)','"Retry all failed" \u2014 re-queues every failed item across all batches (shown when any item has error status)','"Cancel all" \u2014 cancels all active and queued batches; uses the same two-click confirm pattern as per-batch cancel (shown when any upload is active or queued)','"Collapse all" / "Expand all" \u2014 toggle visibility of all batch rows at once (shown when 2+ batches exist with at least 2 in the same state)']},{group:"Upload speed display improvements",items:["Batch transfer rate now uses a rolling 6-second derivative of confirmed bytes rather than summing per-item speeds; small files (single PutObject, no progress events) contribute the same as large files (continuous multipart updates), so the rate is accurate and uniform regardless of file size",'Completed items in the per-file list now show their measured average upload speed ("\u2713 Complete \xB7 2.1 MB/s"), giving a consistent display between in-progress large files and finished small files']},{group:"Browser extension upload blocking detection",items:['Uploads blocked by ad/content blockers (uBlock Origin, etc.) now show an actionable warning rather than a cryptic network error: "Request may have been blocked by a browser extension" with guidance to disable the extension for the page or allowlist the destination domain','Detection covers all three browsers: Firefox ("NetworkError when attempting to fetch resource"), Chrome ("Failed to fetch"), Safari ("Load failed"); correctly ignored when an HTTP response was received (genuine server errors are unaffected)']},{group:"Failed upload visibility",items:["Batches containing failed items now show a red left accent border, making them immediately scannable across a long queue without expanding anything","Failed items float to the top of their batch's expanded list so they are visible without scrolling",'Batches are force-expanded the first time an error appears, so failures are never hidden behind a collapsed "Show" button']},{group:"In-app changelog grouping",items:["The changelog modal now renders a second level of hierarchy: Bold section headers in CHANGELOG.md become labelled groups with their items nested beneath them; entries without headers render as a flat list as before (no change to older releases)"]},{group:"Upload queue bug fixes",items:['Fixed page freeze (Firefox "Script terminated by timeout") caused by Preact diffing 15 000+ UploadLog rows on every queue update; upload history now renders at most 200 rows (all entries still counted for summary stats)',"Fixed upload history panel popping in and out during active uploads; the panel no longer hides after initial load",'Fixed re-dragging a previously cancelled folder showing files as "paused"; cancel now deletes the IndexedDB resume record','Fixed race condition where cancelling a batch during the resume-record lookup could set cancelled items back to "paused"']}]},{version:"1.13.22",date:"2026-06-03",title:"Remove redundant preview button from file row actions",changes:["The filename is already clickable (accent colour, underline on hover) and opens the preview modal; the separate \u2299 button in the actions column did the same thing","Removing it reduces the actions column from 5 buttons to 4"]},{version:"1.13.21",date:"2026-06-03",title:"Fix preview modal layout jank with fixed-height content stage",changes:["Preview content area now has a fixed height (clamp(300px, 70vh, 700px)) so the modal opens at full size immediately \u2014 no reflow as media loads",`Added --surface-raised background on the stage so the loading spinner and "can't preview" state appear in a clearly defined area`,"Audio previews use a compact 140px stage instead of the full height; for files with a recognised audio extension the compact height is applied immediately (no intermediate expansion)","Image and video max-height changed from 72vh to 100% \u2014 container is now the constraint","PDF height changed from 70vh to 100%; text preview fills and scrolls within the container rather than relying on its own viewport-relative max-height"]},{version:"1.13.20",date:"2026-06-03",title:"Parallelize DeleteObjectsCommand batches (3 concurrent)",changes:["Both batch-delete (selected files) and folder-delete now send up to 3 DeleteObjectsCommand requests concurrently instead of sequentially; each request still deletes up to 1000 objects (S3 API limit)","For a 10,000-object delete this reduces round-trips from 10 serial requests to 4 parallel groups \u2014 roughly 3\xD7 faster at typical provider latencies","Folder-delete uses per-batch .catch() so a single failing request does not abort the remaining batches; errors are still collected and reported"]},{version:"1.13.19",date:"2026-06-03",title:"Batch rAF-aligned updateItem calls; add slow-mock latency option",changes:["Extracted createUpdateBatcher (src/lib/update-batcher.js) \u2014 coalesces non-urgent progress patches into one setItems call per animation frame; urgent status transitions (done, error, paused, etc.) flush immediately and preserve any accumulated bytes for the same item","All 14 status-change updateItem call sites in UploadQueue.jsx now pass urgent = true; the two high-frequency updateProgress calls remain non-urgent and are coalesced per frame","Added 14 unit tests covering merge semantics, urgent/non-urgent paths, and the pending-bytes-preserved invariant (test/update-batcher.test.js)","Added MOCK_S3_LATENCY_MS env var to perf/mock-s3.mjs for realistic benchmark conditions (e.g. MOCK_S3_LATENCY_MS=20 npm run perftest)","BatchSummary self-time: 877ms \u2192 724ms (\u221217%) at 1000 files, 0ms latency"]},{version:"1.13.18",date:"2026-06-03",title:"Replace 8 filter/reduce passes in BatchSummary with a single loop",changes:["Replaced 8 separate filter/reduce calls in BatchSummary (run on every updateItem call over all queued items) with a single for...of loop that computes all counts and collects only the small renderable arrays (errorItems, pausedItems, inFlightItems); BatchSummary self-time: 1143ms \u2192 877ms (\u221223%) at 1000 files; browser idle time increased from 390ms to 716ms"]},{version:"1.13.17",date:"2026-06-03",title:"Cache formatted timestamps in UploadLog and raise bench default to 1000 files",changes:["Added module-level Map cache to formatCompletedAt in UploadLog.jsx so each timestamp is passed through toLocaleString() exactly once; subsequent renders and IndexedDB reloads are O(1) map lookups \u2014 reduced self-time from ~1378ms to ~90ms (\u221293%) at 1000 files","Changed default BENCH_FILES from 200 to 1000 in perf/bench-browser.mjs"]},{version:"1.13.16",date:"2026-06-03",title:"Throttle rAF animation loops to 15fps and skip when tab hidden",changes:["Both animation loops in UploadQueue.jsx (BatchSummary bytes counter and per-item progress) now skip state updates when document.visibilityState is 'hidden' and throttle to ~15fps (66ms gate) when visible; reduces animation overhead by ~75% during long uploads and to zero when tab is hidden"]},{version:"1.13.15",date:"2026-06-03",title:"Use version string as build-id for deterministic builds",changes:["build-id meta tag now contains the version string (e.g. 1.13.15) instead of a build timestamp; repeated builds from the same source produce identical output, eliminating the dirty dist/index.html left behind by the pre-push hook"]},{version:"1.13.14",date:"2026-06-03",title:"Debounce setLogKey to eliminate dominant CPU hotspot",changes:["Debounced onLogEntry callback in App.jsx (fires at most every 500ms) to eliminate O(N\xB2) toLocaleString() calls in UploadLog; wall-clock time for a 200-file upload dropped 30% (3862ms \u2192 2705ms), formatCompletedAt CPU self-time dropped from ~24% to ~5%"]},{version:"1.13.13",date:"2026-06-03",title:"Add performance benchmarking harness and unify build modes",changes:["Added npm run perftest \u2014 full browser benchmark using Playwright + CDP profiling against a local mock S3 server; saves .cpuprofile to perf/output/","Added npm run bench \u2014 fast algorithmic microbenchmarks (no browser required)","Unified build configuration in build.mjs with explicit --mode=prod|dev|perf; each mode determines destination directory, minification, source maps, and whether production invariants run","Simplified serve.mjs to delegate build logic to build.mjs --mode=dev","Perf builds write to perf/index.html; dist/ is never touched by benchmarks","Added data-testid attributes to upload queue file input and completion indicator"]},{version:"1.13.12",date:"2026-06-03",title:"Add design-intent documentation for all components and libraries",changes:["Added docs/intent/ documentation set (baseline v1.11.3): architecture overview, data flow, storage model, design principles, and per-module intent for all src/lib/ modules, Browser.jsx, and all other components"]},{version:"1.13.11",date:"2026-06-03",title:"Fix file concurrency setting not taking effect mid-queue",changes:["Changing the file concurrency setting while uploads are in progress had no effect because queueRef.current.concurrency was only updated in enqueueUpload (called when adding files). The Queue's _drain() kept reading the original value on every completion.","Fix: re-read loadFileConcurrency() in runUpload's finally block, which executes immediately before the Queue's own .finally() calls _drain() \u2014 so the new value is in place at exactly the right moment."]},{version:"1.13.10",date:"2026-06-03",title:"Add per-queue desktop notification mute toggle",changes:['Add "Notifs on / Notifs off" toggle button to the batch summary header. Only shown when Notification permission has been granted. Takes effect immediately on the next completed upload \u2014 a ref is checked at fire time so toggling mid-queue requires no async coordination.',"State is queue-scoped (resets when the queue is cleared) and does not affect the notification permission grant itself."]},{version:"1.13.9",date:"2026-06-03",title:"Fix profile save capturing empty fields and clearing the form",changes:["handleSaveProfile was reading from credentials state (only updated on Connect) instead of liveFormData. Result: saved profiles were empty and the form cleared immediately after saving because the key-prop change triggered a remount against the stale empty credentials.","Fix: build the profile from liveFormData; sync credentials after saving so the remounted form retains the values the user entered."]},{version:"1.13.8",date:"2026-06-03",title:"Trim surrounding whitespace from pasted credential values",changes:["Pasting a value with leading or trailing whitespace into any credential field (endpoint, bucket, key ID, secret key, region) now automatically strips the whitespace. Only intercepts pastes that actually contain surrounding whitespace \u2014 normal typing and clean pastes are unaffected. Handles partial-field paste (selection replaced) correctly via cursor position tracking."]},{version:"1.13.7",date:"2026-06-03",title:"Fix profile save button not enabling as form is filled",changes:[`"Save as profile\u2026" was always disabled while typing because ProfilePicker checked App's credentials state, which only updates on Connect \u2014 not as the user types. Fix: CredentialForm fires onFormChange on every keystroke; App tracks liveFormData and passes it to ProfilePicker instead.`]},{version:"1.13.6",date:"2026-06-03",title:"Fix Wasabi bare endpoint region auto-detection",changes:["s3.wasabisys.com (no region segment) is Wasabi's documented legacy endpoint for us-east-1. extractRegion now returns 'us-east-1' for this host instead of falling through to null and showing the manual region input."]},{version:"1.13.5",date:"2026-06-03",title:"Add serve link to file:// banner and fix banner link color",changes:['Add a "Run npm run serve for a local server" link to the file:// warning banner, point
